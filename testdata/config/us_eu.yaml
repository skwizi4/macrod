git:
  # доставка exchange/ в приватный репо после каждого экспорта (ТЗ §12.10, D10);
  # ключ — env GIT_SSH_KEY_PATH (deploy key с правом записи только в этот репо)
  enabled: false
  repo: "you/macro_exchange"
  branch: main
  # remote: "git@github.com:you/macro_exchange.git"   # по умолчанию — из repo
  author_name: "macro-collector"
  author_email: "macro-collector@localhost"
  commit_message: "export {iso_week} {region} {kind}" # {region} — id региона: у каждого региона свой коммит
notify:
  telegram_bot: false # TG_BOT_TOKEN, TG_CHAT_ID в env (ТЗ §12.11)
  source_down_after: 24h # «Источник X недоступен > 24 ч»
backup:
  cron: "30 3 * * *" # ежедневно, VACUUM INTO ${data_dir}/backups/ (ТЗ §14)
  keep: 7
metrics:
  zscore_window_daily_weekly: 52w
  zscore_window_monthly_quarterly: 5y
# =====================================================================
# ЧИСЛОВЫЕ РЯДЫ. Храним уровни. transforms — что считает Go.
# agent: usa_monetary | usa_fiscal | usa_master | eu_monetary | eu_fiscal | eu_master
# =====================================================================
fred:
  # api_key: env FRED_API_KEY
  # расписание релизов определяется автоматически: fred/series/release + fred/release/dates
  series:
    # --- USA Monetary: рост ---
    - {id: GDPC1, agent: usa_monetary, label: "Real GDP", transforms: [qoqa, yoy]}
    - {id: GDPNOW, agent: usa_monetary, label: "GDPNow", transforms: [level, d]}
    - {id: GDP, agent: usa_monetary, label: "Nominal GDP", transforms: [qoqa, yoy]}
    - {id: GDPDEF, agent: usa_monetary, label: "GDP Deflator", transforms: [qoqa, yoy]}
    - {id: PCE, agent: usa_monetary, label: "Personal Consumption", transforms: [mom, yoy, a3m]}
    - {id: NETEXP, agent: usa_monetary, label: "Net Exports", transforms: [level, d]}
    - {id: PSAVERT, agent: usa_monetary, label: "Personal Saving Rate", transforms: [level, d]}
    # --- USA Monetary: сентимент ---
    - {id: UMCSENT, agent: usa_monetary, label: "UMich Sentiment", transforms: [level, d, z]}
    - {id: MICH, agent: usa_monetary, label: "UMich Inflation Exp 1Y", transforms: [level, d]}
    # --- USA Monetary: труд ---
    - {id: UNRATE, agent: usa_monetary, label: "Unemployment Rate", transforms: [level, d]}
    - {id: JTSJOL, agent: usa_monetary, label: "Job Openings", transforms: [level, yoy]}
    - {id: JTSJOR, agent: usa_monetary, label: "Job Openings Rate", transforms: [level]}
    - {id: UNEMPLOY, agent: usa_monetary, label: "Unemployed", transforms: [], hidden: true}
    - {id: CES0500000003, agent: usa_monetary, label: "Avg Hourly Earnings", transforms: [yoy, a3m]}
    - {id: ECIALLCIV, agent: usa_monetary, label: "Employment Cost Index", transforms: [yoy, qoqa]}
    - {id: JTSHIL, agent: usa_monetary, label: "Hires", transforms: [level, yoy]}
    - {id: JTSQUR, agent: usa_monetary, label: "Quits Rate", transforms: [level, d]}
    - {id: ULCNFB, agent: usa_monetary, label: "Unit Labor Costs", transforms: [yoy]}
    - {id: OPHNFB, agent: usa_monetary, label: "Labour Productivity", transforms: [yoy]}
    - {id: PAYEMS, agent: usa_monetary, label: "Nonfarm Payrolls", transforms: [diff, avg3]}
    - {id: ICSA, agent: usa_monetary, label: "Initial Claims", transforms: [level, avg4w, z]}
    - {id: CCSA, agent: usa_monetary, label: "Continued Claims", transforms: [level, avg4w, z]}
    # --- USA Monetary: инфляция ---
    - {id: CPIAUCSL, agent: usa_monetary, label: "CPI", transforms: [yoy, mom, a3m, a6m]}
    - {id: CPILFESL, agent: usa_monetary, label: "Core CPI", transforms: [yoy, mom, a3m, a6m]}
    - {id: CUSR0000SAH1, agent: usa_monetary, label: "Shelter CPI", transforms: [yoy, a3m]}
    - {id: CUSR0000SASL2RS, agent: usa_monetary, label: "Supercore CPI (услуги без жилья)", transforms: [yoy, mom, a3m, a6m]}
    - {id: STICKCPIM159SFRBATL, agent: usa_monetary, label: "Sticky CPI", transforms: [level]}
    - {id: PPIFIS, agent: usa_monetary, label: "PPI Final Demand", transforms: [yoy, mom]}
    - {id: PPIFES, agent: usa_monetary, label: "Core PPI", transforms: [yoy, mom]}
    - {id: WPSFD49116, agent: usa_monetary, label: "Core PPI ex trade", transforms: [yoy, mom]}
    - {id: PCEPI, agent: usa_monetary, label: "PCE Price Index", transforms: [yoy, a3m]}
    - {id: PCEPILFE, agent: usa_monetary, label: "Core PCE", transforms: [yoy, mom, a3m, a6m]}
    # --- USA Monetary: ожидания и ФРС ---
    - {id: T5YIE, agent: usa_monetary, label: "5Y Breakeven", transforms: [level, d1w, d4w]}
    - {id: T5YIFR, agent: usa_monetary, label: "5Y5Y Forward", transforms: [level, d1w, d4w]}
    - {id: T10YIE, agent: usa_monetary, label: "10Y Breakeven", transforms: [level, d1w, d4w]}
    - {id: DFF, agent: usa_monetary, label: "Fed Funds", transforms: [level]}
    - {id: DGS2, agent: usa_monetary, label: "UST 2Y", transforms: [level, d1w, d4w]}
    - {id: M2SL, agent: usa_monetary, label: "M2", transforms: [yoy, a3m]}
    - {id: DCOILWTICO, agent: usa_monetary, label: "WTI (FRED, запас)", transforms: [], fallback_for: "CL=F"}
    - {id: DHHNGSP, agent: usa_monetary, label: "Henry Hub (FRED, запас)", transforms: [], fallback_for: "NG=F"}
    # --- USA Fiscal & Liquidity ---
    - {id: WALCL, agent: usa_fiscal, label: "Fed Balance Sheet", transforms: [level, d1w, d4w]}
    - {id: WDTGAL, agent: usa_fiscal, label: "TGA (Wed)", transforms: [level, d1w, d4w]}
    - {id: RRPONTSYD, agent: usa_fiscal, label: "ON RRP", transforms: [level, d1w, d4w]}
    - {id: WRESBAL, agent: usa_fiscal, label: "Bank Reserves", transforms: [level, d1w, d4w]}
    - {id: SOFR, agent: usa_fiscal, label: "SOFR", transforms: [level]}
    - {id: IORB, agent: usa_fiscal, label: "IORB", transforms: [level]}
    - {id: RPONTSYD, agent: usa_fiscal, label: "Standing Repo Facility", transforms: [level], flag_if_gt: 0}
    - {id: MTSDS133FMS, agent: usa_fiscal, label: "Federal Deficit/Surplus", transforms: [level, sum12m, sum12m_yoy]}
    - {id: GFDEGDQ188S, agent: usa_fiscal, label: "Debt-to-GDP", transforms: [level, d]}
    - {id: A091RC1Q027SBEA, agent: usa_fiscal, label: "Interest Payments", transforms: [yoy]}
    - {id: GCE, agent: usa_fiscal, label: "Government Spending", transforms: [yoy]}
    - {id: DGS3MO, agent: usa_fiscal, label: "UST 3M", transforms: [level, d1w]}
    - {id: DGS10, agent: usa_fiscal, label: "UST 10Y", transforms: [level, d1w, d4w, z]}
    - {id: DGS30, agent: usa_fiscal, label: "UST 30Y", transforms: [level, d1w, d4w]}
    - {id: DFII10, agent: usa_fiscal, label: "Real Yield 10Y", transforms: [level, d1w, d4w]}
    - {id: THREEFYTP10, agent: usa_fiscal, label: "Term Premium 10Y", transforms: [level, d1w, d4w]}
    # CMT для «≈tail» аукционов (high yield − CMT того же срока за день аукциона; решение 2026-10-24)
    - {id: DGS3, agent: usa_fiscal, label: "UST 3Y (для ≈tail)", transforms: [], hidden: true}
    - {id: DGS5, agent: usa_fiscal, label: "UST 5Y (для ≈tail)", transforms: [], hidden: true}
    - {id: DGS7, agent: usa_fiscal, label: "UST 7Y (для ≈tail)", transforms: [], hidden: true}
    - {id: DGS20, agent: usa_fiscal, label: "UST 20Y (для ≈tail)", transforms: [], hidden: true}
    # --- USA Master (markets) ---
    - {id: BAMLH0A0HYM2, agent: usa_master, label: "HY Spread", transforms: [level, d1w, d4w, z]}
    - {id: BAMLC0A0CM, agent: usa_master, label: "IG Spread", transforms: [level, d1w, d4w]}
    - {id: DTWEXBGS, agent: usa_master, label: "Dollar Broad (запас)", transforms: [], fallback_for: "DX-Y.NYB"}
    - {id: NASDAQCOM, agent: usa_master, label: "NASDAQ Composite (запас)", transforms: [], fallback_for: "^NDX"}
    # --- USA News: sentiment (FIXES_W44 F5, D16) ---
    - {id: WRMFNS, agent: usa_news, label: "Розничные фонды денежного рынка", transforms: [level, d1w, d4w]}
yahoo:
  # некритичный источник; опрос раз в день после закрытия + в недельный экспорт
  # неофициальный API, без cookie/crumb; ответ chart.result[0] (LOOKUP Y1, 2026-10-24)
  # символы собираются по регионам: тег agent → regions[].agents[].series_tags; время опроса — regions[].yahoo_poll
  endpoint: "https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
  symbols:
    - {symbol: "^NDX", agent: usa_master, label: "NASDAQ 100", transforms: [level, d1w, d4w, ma50, ma200]}
    - {symbol: "NQ=F", agent: usa_master, label: "NASDAQ fut", transforms: [level, d1w]}
    - {symbol: "^GSPC", agent: usa_master, label: "S&P 500", transforms: [level, d1w, d4w]}
    - {symbol: "^VIX", agent: usa_master, label: "VIX", transforms: [level, d1w, d4w, z]}
    - {symbol: "^MOVE", agent: usa_master, label: "MOVE", transforms: [level, d1w, d4w, z]}
    - {symbol: "DX-Y.NYB", agent: usa_master, label: "Dollar Index", transforms: [level, d1w, d4w]}
    - {symbol: "GC=F", agent: usa_master, label: "Gold", transforms: [level, d1w, d4w]}
    - {symbol: "HG=F", agent: usa_master, label: "Copper", transforms: [level, d1w, d4w]}
    - {symbol: "BTC-USD", agent: usa_master, label: "Bitcoin", transforms: [level, d1w, d4w]}
    - {symbol: "CL=F", agent: usa_monetary, label: "WTI", transforms: [level, d1w, d4w, yoy]}
    - {symbol: "NG=F", agent: usa_monetary, label: "Henry Hub", transforms: [level, d1w, d4w]}
    # Sentiment (FIXES_W44 F3/F4, D16): волатильность и ширина рынка → usa/news/sentiment.md
    - {symbol: "ZT=F", agent: usa_news, label: "2Y fut (ZT=F)", transforms: [level]} # G4b: дневные движения 2Y
    - {symbol: "^VIX3M", agent: usa_news, label: "VIX 3M", transforms: [level, d1w, d4w, z]}
    - {symbol: "^SKEW", agent: usa_news, label: "SKEW", transforms: [level, d1w, d4w, z]}
    - {symbol: "SPY", agent: usa_news, label: "SPY", transforms: [level, d1w, d4w]}
    - {symbol: "RSP", agent: usa_news, label: "RSP (S&P 500 equal weight)", transforms: [level, d1w, d4w]}
    - {symbol: "QQQ", agent: usa_news, label: "QQQ", transforms: [level, d1w, d4w]}
    - {symbol: "QQEW", agent: usa_news, label: "QQEW (NASDAQ-100 equal weight)", transforms: [level, d1w, d4w]}
    - {symbol: "IWM", agent: usa_news, label: "IWM (Russell 2000)", transforms: [level, d1w, d4w]}
