stoxx:
  # Текстовые файлы истории индексов STOXX («Date;Symbol;Indexvalue», вся история в одном файле); key — имя файла.
  # У Yahoo VDAX-NEW и VSTOXX нет. Условия использования не прочитаны — в демо закрыт (D25).
  enabled: true
  endpoint: "https://www.stoxx.com/document/Indices/Current/HistoricalData"
  poll_cron: "0 19 * * 1-5" # Europe/Bratislava, после закрытия
  series:
    - {id: VDAX_NEW, key: "h_v1x.txt", agent: eu_master, label: "VDAX-NEW", frequency: d, units: "Index Points", transforms: [level, d1w, d4w, z]}
    - {id: VSTOXX, key: "h_v2tx.txt", agent: eu_master, label: "VSTOXX", frequency: d, units: "Index Points", transforms: [level, d1w, d4w, z]}
zew:
  # ZEW Finanzmarkttest: konjunktur.xls (старый двоичный Excel), лист data; key — заголовок столбца.
  # Файл проверяется целиком: значения −100…+100, месяцы подряд; не прошёл — ошибка в status, в БД ничего
  # (запасной путь — macroctl input). robots.txt: Crawl-delay 15 — один запрос на опрос. Релиз 11:05 Europe/Berlin.
  # Перепечатка — с согласия ZEW: в демо закрыт (D25).
  enabled: true
  endpoint: "https://www.zew.de/fileadmin/FTP/div/konjunktur.xls"
  sheet: "data"
  poll_cron: "10 11 * * *" # Europe/Bratislava
  series:
    - {id: ZEW_SENTIMENT, key: "ZEW Indicator of Economic Sentiment Germany, balances", agent: eu_monetary, label: "ZEW Economic Sentiment (DE)", frequency: m, units: "Balance", transforms: [level, d]}
    - {id: ZEW_SITUATION, key: "Economic Situation Germany, balances", agent: eu_monetary, label: "ZEW Economic Situation (DE)", frequency: m, units: "Balance", transforms: [level, d]}
manual:
  # Ручной ввод: macroctl input <id> <значение> --period YYYY-MM  → source=manual, в отчётах пометка «ручной ввод».
  # Ifo: сайт ifo.de закрыт проверкой от ботов, у Бундесбанка и DBnomics ряда нет (D25).
  # release_dates — дни выхода (YYYY-MM-DD): через сутки после такого дня ряд без нового значения помечается stale.
  series:
    - {id: IFO_CLIMATE, agent: eu_monetary, label: "Ifo Business Climate (DE, 2015=100)", frequency: m, units: "Index", transforms: [level, d], release_dates: []} # [[FILL: даты выхода Ifo на ближайшие полгода — с ifo.de]]
    - {id: IFO_EXPECTATIONS, agent: eu_monetary, label: "Ifo Expectations (DE, 2015=100)", frequency: m, units: "Index", transforms: [level, d], release_dates: []} # [[FILL: те же даты]]
finanzagentur:
  # Аукционы Bund (ТЗ §6.1, LOOKUP 2026-11-11): итоги текущего года, история с 1999 (backfill),
  # страница календаря со ссылкой на план аукционов (имя файла меняется каждый квартал).
  # Приём заявок 08:00–11:30 Europe/Berlin; строки OH (из собственных запасов) и Syn не аукционы — пропускаются.
  enabled: true
  results_url: "https://www.deutsche-finanzagentur.de/fileadmin/user_upload/Institutionelle-investoren/auktionen/emissionsergebnisse_aktuell_en.xlsx"
  history_url: "https://www.deutsche-finanzagentur.de/fileadmin/user_upload/Institutionelle-investoren/auktionen/emissionshistorie_en.xlsx"
  calendar_page: "https://www.deutsche-finanzagentur.de/en/federal-securities/issuances/issuance-calendar"
  agent: eu_fiscal
  poll_cron: "30 13 * * 1-5" # Europe/Bratislava; страховочный опрос (D8), в день аукциона — событие календаря
  timezone: "Europe/Berlin" # дни аукционов и конец приёма заявок (11:30)
  # какие бумаги плана аукционов (Issuance outlook) идут в календарь и с какой важностью; Bubill — нет (по 2–3 в неделю)
  calendar_importance: {Bund: medium, Bobl: medium, Schatz: low, "Green issue": low}
# Календари публикаций, известные датами (ТЗ §8.1; LOOKUP 2026-11-11, PROGRESS «Фаза 11, батч 11d»).
# kind: ics (Eurostat, только даты) | ecb_statscal (страница ЕЦБ, дата и время) | dates (даты в конфиге: PDF издателя).
# match — название события у издателя дословно; series — ряды, которые выходят в этот релиз: в день события
# демон опрашивает их источник, событие закрывается, когда ряды обновились; по этим дням считается stale (§17.7).
# previous — что показать в calendar_eu.md как «Прошлое значение». Destatis не используется (сайт закрыт от ботов).
release_calendars:
  - name: eurostat
    horizon_days: 120 # квартальные релизы (стоимость труда, ULC, BLS) — дальше общего горизонта; нужно для флага stale
    kind: ics
    url: "https://ec.europa.eu/eurostat/o/calendars/eventsIcal?theme=0&category=0"
    agent: eu_monetary
    timezone: "Europe/Luxembourg"
    time: "11:00" # первые публикации Eurostat — 11:00 CET (протокол беспристрастного доступа)
    events:
      # HICP хранится из ЕЦБ (поток HICP): ЕЦБ обновляет его в 15:00 (флеш) и 12:00 (итог) — опрос это покрывает
      - {match: "Flash estimate inflation euro area", name: "Флеш HICP еврозоны", importance: high, series: [HICP, HICP_CORE], previous: {series: HICP, code: yoy, name: "HICP г/г"}}
      - {match: "Inflation (HICP)", name: "HICP еврозоны (итог)", importance: medium, series: [HICP, HICP_CORE, HICP_SA, HICP_CORE_SA], previous: {series: HICP_CORE, code: yoy, name: "HICP core г/г"}}
      - {match: "Flash estimate GDP and employment - EU and euro area", name: "Флеш ВВП еврозоны", importance: high, series: [GDP_EA, EMPL_EA], previous: {series: GDP_EA, code: qoq, name: "ВВП кв/кв"}}
      - {match: "GDP main aggregates and employment", name: "ВВП еврозоны (основные агрегаты)", importance: medium, series: [GDP_EA, GDP_DE, GDP_FR, GDP_IT, GDP_ES, GDP_EA_NOM, GDP_EA_DEFL, CONS_EA, EXPORTS_EA, IMPORTS_EA, NETEXP_EA, EMPL_EA, ULC_EA, PROD_EA], previous: {series: GDP_EA, code: qoq, name: "ВВП кв/кв"}}
      # батч 11f: релизы рядов паритета (заголовки — из .ics Eurostat, testdata/relcal/eurostat.ics)
      - {match: "Unemployment", name: "Безработица еврозоны", importance: medium, series: [UNEMP_EA, UNEMP_DE, UNEMP_FR, UNEMP_IT, UNEMP_ES], previous: {series: UNEMP_EA, code: level, name: "безработица EA"}}
      - {match: "Industrial production", name: "Промпроизводство еврозоны", importance: medium, series: [IP_EA], previous: {series: IP_EA, code: yoy, name: "промпр. г/г"}}
      - {match: "Retail trade", name: "Розничные продажи еврозоны", importance: low, series: [RETAIL_EA], previous: {series: RETAIL_EA, code: yoy, name: "розница г/г"}}
      - {match: "Industrial producer prices, domestic market", name: "PPI еврозоны", importance: low, series: [PPI_EA, PPI_EA_CORE], previous: {series: PPI_EA, code: yoy, name: "PPI г/г"}}
      - {match: "Labour cost index", name: "Индекс стоимости труда", importance: medium, series: [LCI_EA], previous: {series: LCI_EA, code: yoy, name: "стоимость труда г/г"}}
      - {match: "Job vacancy", name: "Вакансии", importance: low, series: [JOBVAC_EA], previous: {series: JOBVAC_EA, code: level, name: "доля вакансий"}}
      - {match: "First release sector accounts (households and businesses)", name: "Счета секторов: сбережения домохозяйств", importance: low, series: [SAVING_EA], previous: {series: SAVING_EA, code: level, name: "норма сбережений"}}
      - {match: "Second release sector accounts (households)", name: "Счета секторов (уточнение)", importance: low, series: [SAVING_EA]}
      - {match: "Quarterly government debt", name: "Госдолг стран ЕС (квартал)", importance: low, series: [DE_DEBT_GDP, FR_DEBT_GDP, ES_DEBT_GDP, IT_DEBT_GDP, EA_DEBT_GDP], previous: {series: DE_DEBT_GDP, code: level, name: "долг DE"}}
      - {match: "Quarterly government deficit", name: "Дефицит бюджетов стран ЕС (квартал)", importance: low, series: [IT_DEFICIT_GDP, FR_DEFICIT_GDP, ES_DEFICIT_GDP, EA_DEFICIT_GDP, EA_INTEREST_GDP], previous: {series: IT_DEFICIT_GDP, code: level, name: "баланс IT"}}
  - name: ecb_statscal
    horizon_days: 120 # квартальные релизы (стоимость труда, ULC, BLS) — дальше общего горизонта; нужно для флага stale
    kind: ecb_statscal
    url: "https://www.ecb.europa.eu/press/calendars/statscal/html/index.en.html"
    agent: eu_monetary
    timezone: "Europe/Berlin"
    time: "10:00" # время берётся со страницы; это — если не указано
    events:
      - {match: "Monetary developments in the euro area", dataset: BSI, name: "Денежные агрегаты еврозоны (M3, ЕЦБ)", importance: medium, series: [M3_YOY, LOANS_NFC_YOY, LOANS_HH_YOY], previous: {series: M3_YOY, code: level, name: "M3 г/г"}}
      # батч 11f: заголовки и наборы — из статкалендаря ЕЦБ (testdata/relcal/ecb_statscal.html)
      - {match: "Euro area bank interest rate statistics", dataset: MIR, name: "Ставки по кредитам (ЕЦБ)", importance: low, series: [MIR_NFC, MIR_HOUSE], previous: {series: MIR_NFC, code: level, name: "кредит бизнесу"}}
      - {match: "Euro area Bank Lending Survey", dataset: BLS, name: "Опрос банков (BLS)", importance: medium, series: [BLS_NFC_STD, BLS_NFC_DEM, BLS_HH_STD, BLS_HH_DEM], previous: {series: BLS_NFC_STD, code: level, name: "стандарты, бизнес"}}
      - {match: "Euro Area Indicator of Negotiated Wage Rates", dataset: INW, name: "Переговорные зарплаты (ЕЦБ)", importance: medium, series: [NEG_WAGES], previous: {series: NEG_WAGES, code: level, name: "зарплаты г/г"}}
      - {match: "ECB Wage Tracker", dataset: EWT, name: "Wage tracker ЕЦБ", importance: medium, series: [WAGE_TRACKER], previous: {series: WAGE_TRACKER, code: level, name: "трекер г/г"}}
      - {match: "TARGET balances statistics", dataset: TGB, name: "Сальдо TARGET", importance: low, series: [TARGET_IT, TARGET_DE], previous: {series: TARGET_IT, code: level, name: "TARGET IT"}}
  - name: zew
    kind: dates
    agent: eu_monetary
    timezone: "Europe/Berlin"
    time: "11:05"
    events:
      - {name: "ZEW (Германия)", importance: high, series: [ZEW_SENTIMENT, ZEW_SITUATION], previous: {series: ZEW_SENTIMENT, code: level, name: "ZEW Sentiment"}, dates: [2026-11-17, 2026-12-15, 2027-01-19, 2027-02-16, 2027-03-16, 2027-04-13, 2027-05-11, 2027-06-15, 2027-07-20, 2027-08-17, 2027-09-14, 2027-10-19, 2027-11-16, 2027-12-14, 2028-01-18]}
  - name: ec_survey
    kind: dates
    agent: eu_monetary
    timezone: "Europe/Brussels"
    time: "11:00"
    events:
      - {name: "Опрос Еврокомиссии (ESI, confidence)", importance: medium, series: [EC_ICI_DE, EC_ESI_DE, EC_ESI_EA, EC_CONS_EA, EC_SERV_EA, EC_PRICE_EXP], previous: {series: EC_ICI_DE, code: level, name: "DE industrial confidence"}, dates: [2026-11-27, 2027-01-07]} # [[FILL: даты 2027 — PDF «Publication dates 2027» DG ECFIN]]
      - {name: "Флеш потребительского доверия еврозоны (ЕК)", importance: low, time: "16:00", dates: [2026-11-20, 2026-12-21]}
  # SPF ЕЦБ: дата — со страницы SPF ЕЦБ («next release … 5 February 2027 (provisional)», 2026-11-12); время ЕЦБ не публикует,
  # 10:00 CET — со слов пользователя (12.11). Даты 2027 после февраля ЕЦБ ещё не объявил — дописывать по мере публикации.
  - name: ecb_spf
    kind: dates
    agent: eu_monetary
    timezone: "Europe/Berlin"
    time: "10:00"
    events:
      - {name: "SPF ЕЦБ (опрос прогнозистов)", importance: medium, series: [SPF_NEXT_YEAR, SPF_LT], previous: {series: SPF_NEXT_YEAR, code: level, name: "SPF на следующий год"}, dates: [2027-02-05]}
ecb_texts:
  # Тексты ЕЦБ (ТЗ §6.1): решения, monetary policy statement (вступление) и Q&A пресс-конференции,
  # accounts, речи и интервью членов Исполнительного совета; календарь заседаний и режим дня решения (§8.2).
  # LOOKUP 2026-11-11 (живые запросы). Адрес страницы содержит непредсказуемый хеш (ecb.mp261029~9a493adf17),
  # поэтому в день решения опрашиваются RSS и годовые списки, а не страница.
  enabled: true
  base_url: "https://www.ecb.europa.eu"
  rss: "https://www.ecb.europa.eu/rss/press.html" # 15 последних: речи, интервью, решения, заявления
  lists: # годовые списки; {year} подставляется
    decisions: "/press/govcdec/mopo/{year}/html/index_include.en.html"
    statements: "/press/press_conference/monetary-policy-statement/{year}/html/index_include.en.html"
    accounts: "/press/accounts/{year}/html/index_include.en.html"
  meeting_calendar: "https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html"
  timezone: "Europe/Berlin"
  times: # время публикации, если документ найден в списке, а не в RSS
    decision: "14:15"
    press_conference: "14:45"
    accounts: "13:30"
  poll_interval: 15m # RSS, списки и перечитывание заявлений ради Q&A
  agent: eu_monetary
  check_series: ECB_DFR # сверка распознанной ставки с рядом после вступления решения в силу
  day_mode:
    lead: 1m # начать опрос за минуту до 14:15
    rss_interval: 20s
    list_interval: 60s # годовые списки (35–43 КБ) — подстраховка, если RSS отстаёт
    fast_for: 75m # частый опрос до 15:30, дальше — стандартные шаги §8.2
    alert_decision_at: "14:25" # нет решения — тревога в Telegram
    statement_wait: "15:30" # нет заявления — экспорт с одним решением; нет ничего — тревога
# =====================================================================
# EU MICRO — eu/micro/current_week.md (фаза 11, ТЗ §18.7)
# =====================================================================
# Компании вне квартального потока EDGAR. Цены — Yahoo (symbol), реакция на отчёт — §19.5.
# report_dates — вручную из финансовых календарей эмитентов (LOOKUP 2026-11-11); session: pre_market (по
# умолчанию, немецкие эмитенты публикуются до открытия Xetra) | after_close; estimate: true — дата не
# подтверждена эмитентом. facts — годовые цифры из структурированной отчётности: edgar (company facts
# 20-F, taxonomy ifrs-full) | esef (filings.xbrl.org, lei); тег без префикса — в taxonomy, тег расширения —
# с префиксом (airbus:...). press — лента релизов: rss | html (item — CSS-селектор записи списка,
# link_pattern — RE2 ссылки на релиз, body — CSS-селектор текста на странице релиза); title_words —
# оставить релизы с этими словами в заголовке; exclude — RE2 заголовков, которые не берём.
issuers:
  enabled: true
  poll_cron: "30 8,19 * * 1-5" # Europe/Bratislava: после утренних отчётов и вечером
  request_interval: "3s" # filings.xbrl.org отвечает 429 на несколько запросов подряд
  esef_url: "https://filings.xbrl.org"
  user_agent: "Mozilla/5.0 (compatible; macro-collector)"
  press_history_days: 30
  # абзацы релиза, которые берём (RE2, без учёта регистра): outlook, guidance, ожидания (ТЗ §19.4) + цитаты
  paragraphs: ['\boutlook\b', '\bguidance\b', '\bexpect(s|ed|ing|ations?)?\b', '\bforecast', '\bfull[- ]year\b', '\btariffs?\b']
  release_chars: 1500 # на релиз
  full_releases: 3 # релизов компании за неделю с абзацами; остальные — строкой
  stale_months: 15 # годовые цифры старше — пометка «устарели»
  companies:
    - ticker: SAP
      name: SAP
      symbol: SAP.DE
      currency: EUR
      importance: high
      report_dates:
        - {date: "2027-01-28", period: "Q4 2026", source: "SAP IR, события"}
        - {date: "2027-04-22", period: "Q1 2027", source: "SAP IR, события"}
      facts:
        source: edgar
        cik: "0001000184"
        taxonomy: ifrs-full
        forms: ["20-F"]
        concepts:
          revenue: [Revenue]
          operating_income: [ProfitLossFromOperatingActivities]
          net_income: [ProfitLossAttributableToOwnersOfParent]
          eps: [DilutedEarningsLossPerShare]
          operating_cash_flow: [CashFlowsFromUsedInOperatingActivities]
          capex: [PurchaseOfPropertyPlantAndEquipmentIntangibleAssetsOtherThanGoodwillInvestmentPropertyAndOtherNoncurrentAssets]
          shares: [AdjustedWeightedAverageShares]
      press:
        kind: rss
        url: "https://news.sap.com/feed/"
        # лента SAP — в основном маркетинг (решение пользователя 2026-11-11): только корпоративные заголовки
        title_words: [Results, Outlook, Quarter, Quarterly, Guidance, Executive Board, Supervisory Board, Dividend, Buyback, Share Repurchase, Acquisition, Acquire, Acquires, Annual General Meeting]
    - ticker: SIE
      name: Siemens
      symbol: SIE.DE
      currency: EUR
      importance: high
      report_dates:
        - {date: "2026-11-12", period: "Q4 FY2026", source: "Siemens IR, финансовый календарь"}
      press:
        kind: rss
        url: "https://press.siemens.com/global/en/rss.xml"
      # Квартальный Excel эмитента (шаг 18, D15): только выручка, Profit Industrial Business, прибыль акционерам,
      # EPS базовая — квартал и год назад. Таблица — по строке-заголовку на любом листе, строка — по подписи,
      # столбец — по заголовку периода («Q3» над блоком + «FY 2026»); что-то не нашлось ровно один раз — ошибка.
      quarterly:
        page: "https://www.siemens.com/en-us/company/investor-relations/financial-results/"
        links: ['^(?P<year>\d{4})-q(?P<q>[1-4])-Financial-Results-Excel\.xlsx$']
        fiscal_year_end: 9 # финансовый год Siemens — до 30 сентября
        revenue_label: "Revenue"
        operating_label: "Profit Industrial Business"
        tables:
          - anchor: ["Consolidated Statements of Income"]
            rows:
              revenue: {labels: ["Revenue"]}
              net_income: {labels: ["Shareholders of Siemens AG"]}
              eps: {labels: ["Net income"], section: "Basic earnings per share"}
          - anchor: ["Overview of Segment figures"]
            group: "Profit" # первая строка метки группы столбцов («Profit margin» — другая группа)
            rows:
              operating_income: {labels: ["Industrial Business"]}
    - ticker: ALV
      name: Allianz
      symbol: ALV.DE
      currency: EUR
      importance: high
      report_dates:
        - {date: "2026-11-12", period: "Q3 2026", source: "Allianz IR, финансовый календарь",}
        # пресс-релизы: allianz.com отвечает 403 (Cloudflare) — не обходим
    - ticker: AIR
      name: Airbus
      symbol: AIR.DE
      currency: EUR
      importance: high
      report_dates:
        - {date: "2027-02-18", period: "FY 2026", source: "Airbus IR, финансовый календарь"}
      facts:
        source: esef
        lei: MINO79WLOO247M1IL051
        concepts:
          revenue: [Revenue]
          operating_income: ["airbus:ProfitLossBeforeFinancialResultAndIncomeTaxes"] # EBIT, тег расширения Airbus
          net_income: [ProfitLossAttributableToOwnersOfParent]
          eps: [DilutedEarningsLossPerShare]
          operating_cash_flow: [CashFlowsFromUsedInOperatingActivities]
          capex: ["airbus:PurchasesOfIntangibleAssetsPropertyPlantAndEquipmentInvestmentProperty"]
          # числа акций в ESEF Airbus нет → Δ кап. «—»
      press:
        kind: html
        url: "https://www.airbus.com/en/newsroom/press-releases"
        item: "article.awx-card"
        link_pattern: '/en/newsroom/press-releases/\d{4}-\d{2}-'
        body: "article.node--press-release"
        exclude: ['share buybacks for week']
    - ticker: DTE
      name: Deutsche Telekom
      symbol: DTE.DE
      currency: EUR
      importance: medium
      report_dates:
        - {date: "2027-02-25", period: "FY 2026", source: "Deutsche Telekom IR, финансовый календарь"}
      quarterly:
        page: "https://www.telekom.com/en/investor-relations/publications/financial-results"
        # «dt-26q3-backup.xlsx», «dt-26q2-backup-de.xlsx» (2026), «DT 25Q4 Backup.xlsx» (2025); consensus — не берём
        links: ['(?i)^dt-(?P<year>\d{2})q(?P<q>[1-4])-backup(?:-de)?\.xlsx$', '(?i)^DT (?P<year>\d{2}|\d{4})Q(?P<q>[1-4]) Backup\.xlsx$']
        revenue_label: "Net revenue"
        operating_label: "EBIT"
        tables:
          - anchor: ["DT CONSOLIDATED INCOME STATEMENT", "AS REPORTED"] # лист adj. — «ADJUSTED FOR SPECIAL FACTORS»
            rows:
              revenue: {labels: ["NET REVENUE"]}
              operating_income: {labels: ["PROFIT (LOSS) FROM OPERATIONS (EBIT)"]}
              net_income: {labels: ["NET PROFIT (LOSS)"]}
              # EPS в backup-файле DT нет → «—»
    - ticker: ENR
      name: Siemens Energy
      symbol: ENR.DE
      currency: EUR
      importance: medium
      report_dates:
        - {date: "2026-11-11", period: "Q4 FY2026", source: "Siemens Energy IR, финансовый календарь"}
    - ticker: RHM
      name: Rheinmetall
      symbol: RHM.DE
      currency: EUR
      importance: medium
      report_dates:
        - {date: "2027-03-11", period: "FY 2026", source: "Rheinmetall IR, финансовый календарь"}
    - ticker: MBG
      name: Mercedes-Benz
      symbol: MBG.DE
      currency: EUR
      importance: medium
      report_dates:
        # официальной даты нет; оценка Investing.com (LOOKUP 2026-11-11)
        - {date: "2027-02-18", period: "FY 2026", estimate: true, source: "Investing.com, оценка"}
