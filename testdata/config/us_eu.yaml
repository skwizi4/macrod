    # траектория ставки (замена FedWatch): ближайшие N месячных контрактов
    # ZQ<код месяца CME><YY>.CBT, напр. ZQX26.CBT = ноябрь 2026 (LOOKUP Y3)
    symbol_format: "ZQ{month}{yy}.CBT"
    months_ahead: 12
    agent: usa_monetary
treasury:
  # Fiscal Data: DTS, MTS, байбэки, календарь публикаций; TreasuryDirect TA_WS: результаты и
  # предстоящие аукционы (в Fiscal Data результаты появляются только к дате выпуска). LOOKUP T1–T9.
  fiscal_data_url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service"
  release_calendar_url: "https://api.fiscaldata.treasury.gov/services/calendar/release"
  treasurydirect_url: "https://www.treasurydirect.gov/TA_WS/securities"
  datasets:
    - {name: dts_operating_cash, agent: usa_fiscal, enabled: true} # TGA ежедневно
    - {name: dts_public_debt, agent: usa_fiscal, enabled: true} # DTS: выпуск/погашение рыночных бумаг → чистое размещение
    - {name: mts, agent: usa_fiscal, enabled: true} # Monthly Treasury Statement
    - {name: auctions, agent: usa_fiscal, enabled: true, security_types: ["Bill", "Note", "Bond"]}
    - {name: upcoming_auctions, agent: usa_master, enabled: true} # для календаря
    - {name: buybacks, agent: usa_fiscal, enabled: true}
  quarterly_refunding_url: "https://home.treasury.gov/policy-issues/financing-the-government/quarterly-refunding/most-recent-quarterly-refunding-documents"
# Европа (ЕЦБ, Бундесбанк, Eurostat, STOXX, ZEW, ручной ввод Ifo, тикеры и спреды) — пресет presets/eu-equities.yaml

# PMI (США, еврозона, Германия, Китай), Conference Board — нет бесплатного API:
# берутся из текстов (новости/TG) через классификатор, отдельного числового источника нет
cftc:
  enabled: true
  # TFF — Futures Only (Socrata); нетто Leveraged Funds + Asset Managers (решение 2026-10-24). LOOKUP C1–C3.
  endpoint: "https://publicreporting.cftc.gov/resource/gpe5-46if.json"
  # публикация пт 15:30 ET, бывают переносы на пн → проверка нового отчёта каждый будний вечер
  check_cron: "0 22 * * 1-5" # Europe/Bratislava
  contracts:
    # код — cftc_contract_market_code (названия рынков менялись в 2022, ищем только по коду)
    # позиционирование — у News (D16, FIXES_W44 F5); Euro FX в USA sentiment, EU — фаза 7
    - {name: "Nasdaq-100 E-mini", code: "209742", agent: usa_news}
    - {name: "10Y T-Note", code: "043602", agent: usa_news}
    - {name: "Euro FX", code: "099741", agent: eu_master}
cboe:
  # put/call (FIXES_W44 F3): JSON страницы Cboe Daily Market Statistics, один файл на торговый день,
  # блок ratios; день без файла (выходной, праздник, ещё не вышел) — 403. Не документированный API → некритичный (D7)
  enabled: true
  endpoint: "https://cdn.cboe.com/data/us/options/market_statistics/daily/{date}_daily_options"
  poll_cron: "0 2 * * 2-6" # Europe/Bratislava: ~20:00 ET прошлого торгового дня
  history_days: 400 # backfill: z за 52 нед. + запас
  agent: usa_news
prediction_markets:
  # рынки предсказаний (FIXES_W44 F6, LOOKUP 2026-11-02): данные без ключа. Некритичный источник (D7).
  # Вероятность = последняя цена «да» (0–1) → хранится в %. Ряд: "<тема>|<тикер или slug рынка>".
  enabled: true
  kalshi_endpoint: "https://api.elections.kalshi.com/trade-api/v2"
  polymarket_gamma: "https://gamma-api.polymarket.com"
  polymarket_clob: "https://clob.polymarket.com"
  poll_cron: "30 22 * * *" # Europe/Bratislava, раз в день
  history_days: 35 # первая загрузка рынка: история для Δ1w/Δ4w
  agent: usa_news
  topics:
    - {name: recession, label: "Рецессия в США", kalshi_series: KXRECSSNBER, polymarket_slugs: [us-recession-by-end-of-2026]}
    - {name: fed_next, label: "Решение ФРС, ближайшее заседание", kalshi_series: KXFEDDECISION, kalshi_nearest: true, polymarket_search: "Fed Decision in"}
    - {name: house, label: "Палата представителей (выборы 2026)", kalshi_series: CONTROLH, kalshi_event: CONTROLH-2026, polymarket_slugs: [which-party-will-win-the-house-in-2026]}
    - {name: senate, label: "Сенат (выборы 2026)", kalshi_series: CONTROLS, kalshi_event: CONTROLS-2026, polymarket_slugs: [which-party-will-win-the-senate-in-2026]}
    - {name: shutdown, label: "Шатдаун правительства", kalshi_series: KXGOVTSHUTDOWN, polymarket_slugs: [government-shutdown-by]}
# =====================================================================
# ПРОИЗВОДНЫЕ РЯДЫ (считает Go)
# =====================================================================
derived:
  - {name: NET_LIQUIDITY, formula: "WALCL - WDTGAL - RRPONTSYD", agent: usa_fiscal, transforms: [level, d1w, d4w, z], note: "привести единицы (млн/млрд) и частоту к недельной"}
  - {name: U_V, formula: "UNEMPLOY / JTSJOL", agent: usa_monetary, transforms: [level, d]}
  - {name: SOFR_IORB, formula: "SOFR - IORB", agent: usa_fiscal, unit: bp, flag_if_gt: 0}
  - {name: UST_2S10S, formula: "DGS10 - DGS2", agent: usa_fiscal, unit: bp, transforms: [level, d]}
  - {name: UST_3M10Y, formula: "DGS10 - DGS3MO", agent: usa_fiscal, unit: bp, transforms: [level, d]}
  - {name: FED_PATH, formula: "из фьючерсов ZQ: 100 - цена → implied rate по месяцам; кол-во снижений/повышений по 25 б.п. vs DFF", agent: usa_monetary}
  # обе ноги — доходности Euronext MTS с Yahoo (D25); если MDE10.AS пропал или отстал больше чем на 5 дней —
  # спред считается против Bund 10Y Бундесбанка и помечается «запасная нога»
  - {name: BTP_BUND, label: "BTP-Bund 10Y", formula: "MIT10.AS - MDE10.AS", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w, z], short_history: true}
  - {name: OAT_BUND, label: "OAT-Bund 10Y", formula: "MFR10.AS - MDE10.AS", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w, z], short_history: true}
  - {name: UST_BUND, label: "UST-Bund 10Y", formula: "DGS10 - BUND_10Y", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w]}
  - {name: BUND_2S10S, label: "2s10s Bund", formula: "BUND_10Y - BUND_2Y", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w]}
  # не спред страны: разница двух кривых ЕЦБ, замена показателя → quality: proxy
  - {name: ECB_ALL_AAA_10Y, label: "Кривая ЕЦБ: все эмитенты − AAA, 10Y", formula: "ECB_YC_ALL_10Y - ECB_YC_AAA_10Y", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w], quality: proxy}
  # отношение индексов, приведено к 100 на первой общей дате; Δ — в процентах
  - {name: GER40_NDX, label: "GER40/NDX (нормировано)", formula: "^GDAXI / ^NDX (нормировано)", agent: eu_master, transforms: [level, d1w, d4w]}
  - {name: ESTR_DFR, label: "€STR − ставка по депозитам", formula: "ESTR - ECB_DFR", agent: eu_monetary, unit: bp, transforms: [level, d1w, d4w]}
  - {name: NETEXP_EA, label: "Чистый экспорт еврозоны", formula: "EXPORTS_EA - IMPORTS_EA", agent: eu_monetary, transforms: [level, d]}
  - {name: EXCESS_LIQ, label: "Избыточная ликвидность (≈ текущие счета + депозитный механизм)", formula: "ILM_CURRENT_ACC + ILM_DEPOSIT_FAC", agent: eu_monetary, transforms: [level, d1w, d4w], quality: proxy}
# =====================================================================
# ТЕКСТЫ
# =====================================================================
fed_texts:
  # FOMC statements, minutes, SEP, речи и testimony членов Board, Beige Book.
  # Только federalreserve.gov: speeches.xml содержит речи Board (все 7 — голосующие в 2026);
  # региональные ФРБ не подключаем (решение 2026-10-24). LOOKUP 2026-10-24.
  base_url: "https://www.federalreserve.gov"
  feeds:
    - {name: press_monetary, url: "https://www.federalreserve.gov/feeds/press_monetary.xml"} # statement, minutes, SEP
    - {name: speeches, url: "https://www.federalreserve.gov/feeds/speeches.xml"}
    - {name: testimony, url: "https://www.federalreserve.gov/feeds/testimony.xml"}
  fomc_calendar: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  beige_book: "https://www.federalreserve.gov/monetarypolicy/publications/beige-book-default.htm"
  poll_interval: 15m # RSS: речи, testimony и прочее вне календаря
  agent: usa_monetary
calendar:
  # releases обновляется раз в сутки на horizon_days вперёд (ТЗ §8.1)
  horizon_days: 14
  refresh_cron: "0 5 * * *" # Europe/Bratislava
  # FRED release/dates отдаёт только дату; время выхода — по release_id (LOOKUP 2026-10-24,
  # официальные календари BLS/BEA/ФРС/NY Fed/DOL/UMich). Нет в списке — default_release_time.
  release_timezone: "America/New_York"
  default_release_time: "08:30"
  release_times:
    10: "08:30" # CPI (BLS)
    11: "08:30" # Employment Cost Index (BLS)
    17: "16:15" # H.10, понедельник (ФРС)
    18: "16:15" # H.15 (ФРС)
    20: "16:30" # H.4.1, четверг (ФРС)
    21: "13:00" # H.6, 4-й вторник (ФРС)
    46: "08:30" # PPI (BLS)
    47: "08:30" # Productivity and Costs (BLS)
    50: "08:30" # Employment Situation (BLS)
    53: "08:30" # GDP (BEA)
    54: "08:30" # Personal Income and Outlays (BEA)
    91: "10:00" # Surveys of Consumers (UMich)
    180: "08:30" # UI Weekly Claims, четверг (DOL)
    192: "10:00" # JOLTS (BLS)
    263: "08:30" # Debt to GDP (вместе с GDP)
    304: "16:15" # Interest Rate Spreads (из H.15)
    313: "08:30" # Sticky Price CPI (в день CPI)
    379: "13:15" # Temporary OMO / RRP (окно операции 12:45–13:15)
    445: "08:00" # SOFR (NY Fed)
  # важность релизов FRED для calendar_usa.md — по ★ в DATA_MAP; нет в списке — low
  release_importance:
    10: high # CPI ★
    11: medium # Employment Cost Index ★
    20: medium # H.4.1: WALCL, TGA, резервы ★
    46: high # PPI ★
    50: high # Employment Situation: NFP, безработица ★
    53: high # GDP ★
    54: high # Personal Income and Outlays: PCE ★
    91: high # UMich ★
    180: high # Initial / Continued Claims ★
    192: high # JOLTS ★
    363: medium # Monthly Treasury Statement: дефицит ★
    386: medium # GDPNow ★
# Посты Telegram и RSS (фаза 4). Новый канал или лента — одна строка ниже;
# демон подхватит её при перезапуске и сам загрузит историю за history_days.
# Проверить источник до включения: macroctl source-check tg:<handle> | rss:<url>
posts:
  poll_interval: 15m
  history_days: 30 # история при первом опросе нового источника (переопределяется в строке источника)
telegram:
  enabled: true
  mode: web # публичные каналы через t.me/s/<handle> (D12); mtproto не реализован
  base_url: "https://t.me"
  channels:
    # handle — имя из ссылки t.me/<handle>; region: usa | eu ; type: news | opinion
    # default_tag: "" | usa_monetary | usa_fiscal | usa_micro | usa_politics | energy_geopolitics | eu_ecb | eu_fiscal | eu_macro | eu_micro
    # history_days: необязательно, по умолчанию posts.history_days
    - {handle: marketnews_ua, region: usa, type: news, default_tag: "", profile: "укр. рыночная лента: быстрые новости, цифры релизов, отчёты, ссылки на подкасты"} # Market News, укр.; пишет и про Европу
    - {handle: macro_views, region: usa, type: opinion, default_tag: "", opinions_full: 10, profile: "рус. макро-аналитика, авторские выводы о ставках, ликвидности и AI-капексе"} # Macro Views, рус.
    - {handle: us_politics_ru, region: usa, type: opinion, default_tag: usa_politics, opinions_full: 5, profile: "российский политический комментарий, оценочный, факты не проверены"} # политический комментатор, рус.; политика США (G5, решение 2026-11-03)
rss_feeds: []
# name — латиница/цифры/_ (источник в БД: rss:<name>); остальные поля — как у каналов
# формат: - { name: <имя>, url: "<лента>", region: usa, type: opinion, default_tag: "", profile: "<кто автор>" }
# macro_letter убран 2026-11-06 (решение пользователя): лента пуста с 2026-07-13, ноль статей за всё время.
# Substack иногда отвечает 403 с заглушкой Cloudflare («Just a moment…») — источник попадает в sources_failed.

# =====================================================================
# КОМПАНИИ
# =====================================================================
edgar:
  # SEC EDGAR (USA Micro). Числа (выручка, EPS, capex, фин. показатели) — ТОЛЬКО из JSON XBRL company facts;
  # 10-K/10-Q не скачиваются. Из HTML читается лишь пресс-релиз 8-K (Ex-99.1) — ради Outlook и цитат.
  enabled: true
  user_agent: "macro-collector you@example.com" # SEC требует реальный контакт (e-mail); без него — 403; doctor проверяет
  data_url: "https://data.sec.gov" # submissions, api/xbrl/companyfacts
  archives_url: "https://www.sec.gov/Archives/edgar/data" # index-headers и Ex-99.1 подач 8-K
  requests_per_second: 8 # лимит SEC — 10 в секунду на пользователя
  form_types: ["8-K", "10-Q", "10-K"]
  history_start: "2024-01-01" # 8+ кварталов для YoY
  concepts: # us-gaap теги по приоритету (LOOKUP E3, 2026-10-25); компания может переопределить
    revenue: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues]
    eps: [EarningsPerShareDiluted]
    capex: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
    # Фаза 5b (LOOKUP T1–T5, 2026-10-30). Список в списке ([[A], [B]]) — сумма компонентов.
    operating_income: [OperatingIncomeLoss]
    net_income: [NetIncomeLoss, ProfitLoss]
    gross_profit: [GrossProfit]
    cost_of_revenue: [] # только у компаний без GrossProfit: валовая = выручка − себестоимость (META, GOOGL)
    da: [DepreciationDepletionAndAmortization]
    operating_cash_flow: [NetCashProvidedByUsedInOperatingActivities]
    buybacks: [PaymentsForRepurchaseOfCommonStock]
    dividends: [PaymentsOfDividends, PaymentsOfDividendsCommonStock]
    cash: [CashAndCashEquivalentsAtCarryingValue]
    short_term_investments: [MarketableSecuritiesCurrent] # нет факта на дату — 0 (у AVGO нет)
    debt: [LongTermDebt] # с текущей частью; первый компонент обязателен, остальные — 0, если нет
    diluted_shares: [WeightedAverageNumberOfDilutedSharesOutstanding]
    # Фаза 5c (LOOKUP C1–C3, 2026-10-30). Прочие = прибыль до налога − операционная.
    pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest]
    income_tax: [IncomeTaxExpenseBenefit]
    rpo: [RevenueRemainingPerformanceObligation] # нет у AAPL, AMZN, META
  companies: # CIK — sec.gov/files/company_tickers.json (LOOKUP E1); importance — в календаре
    - ticker: NVDA
      cik: "0001045810"
      importance: high
      concepts:
        revenue: [Revenues]
        capex: [PaymentsToAcquireProductiveAssets]
        short_term_investments: [DebtSecuritiesCurrent, MarketableSecuritiesCurrent] # сменила тег в 2026
    - ticker: MSFT
      cik: "0000789019"
      importance: high
      concepts:
        da: [Depreciation] # строка «Depreciation, amortization, and other»
        dividends: [PaymentsOfDividendsCommonStock]
        short_term_investments: [ShortTermInvestments]
    - ticker: AAPL
      cik: "0000320193"
      importance: medium
      concepts:
        debt: [[LongTermDebt], [CommercialPaper]]
    - ticker: AMZN
      cik: "0001018724"
      importance: high
      not_paid: [buybacks, dividends] # байбэков нет с Q2 2024, дивидендов нет
      concepts:
        capex: [PaymentsToAcquireProductiveAssets]
        debt: [[LongTermDebtNoncurrent], [LongTermDebtCurrent], [ShortTermBorrowings]] # LongTermDebt у AMZN — номинал
        pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
    - ticker: META
      cik: "0001326801"
      importance: high
      concepts:
        cost_of_revenue: [CostOfRevenue]
        debt: [[LongTermDebtNoncurrent], [LongTermDebtCurrent]]
    - ticker: GOOGL
      cik: "0001652044"
      importance: high
      concepts:
        revenue: [Revenues]
        cost_of_revenue: [CostOfRevenue]
        da: [Depreciation] # только основные средства
        dividends: [PaymentsOfOrdinaryDividends, PaymentsOfDividends] # сменила тег в 2026
        debt: [[LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations], [LongTermDebtCurrent], [CommercialPaper]]
    - ticker: AVGO
      cik: "0001730168"
      importance: medium
      concepts:
        da: [[Depreciation], [AmortizationOfIntangibleAssets]]
        debt: [[LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations], [LongTermDebtCurrent]]
    - ticker: TSLA
      cik: "0001318605"
      importance: medium
      not_paid: [buybacks, dividends]
      concepts:
        revenue: [Revenues]
        da: [Depreciation] # «Depreciation, amortization and impairment»
        short_term_investments: [ShortTermInvestments]
        debt: [[LongTermDebt], [DebtCurrent]] # LongTermDebt у TSLA — без текущей части
  capex_companies: [MSFT, GOOGL, AMZN, META]
  one_off: # ⚠ разовые (ТЗ §19.1, правило 2026-10-31)
    rate_change_pp: 15 # Δ эффективной ставки налога к году назад, п.п.
    other_share_change_pp: 15 # Δ доли «Прочих» в прибыли до налога, п.п.
    materiality_pct: 10 # и искажение чистой прибыли больше, %
  macro_signals: # предложения о макро из 8-K и расшифровок недели (ТЗ §19.4, уточнено 2026-10-31); регистр не важен
    enabled: true
    min_chars: 30
    max_chars: 400
    per_company: 6
    per_company_topic: 2
    max: 25
    exclude: ['non-GAAP', 'forward-looking', 'safe harbor', 'not allocated', 'risks and uncertainties', 'supply chains?', 'days of supply']
    strong: ['exceeds? (available )?supply', '\bdelay', 'constrain', '\bshortages?\b', 'price increases?', '\btariffs?\b', 'voluntary (exit|separation|retirement)', '\blayoffs?\b', 'headcount', 'higher memory']
    topics: # порядок = приоритет (FIXES_W44 D2); FX не используется: шаблон, а не сигнал (ревью W44)
      - {name: спрос, patterns: ['demand (continues to |that )?exceeds?', '\b(strong|stronger|weak|weaker|weakening|huge) demand', 'consumer (demand|spending)', 'demand environment']}
      - {name: мощности, patterns: ['\bsupply\b', '(capacity|supply)[-‑ ]constrain', 'capacity deliveries', 'third[-‑ ]party (compute|capacity)', '\bshortages?\b']}
      - {name: цены, patterns: ['price increases?', 'raise prices', 'higher prices', 'pricing (pressure|environment)']}
      - {name: найм, patterns: ['headcount', '\blayoffs?\b', 'voluntary (exit|separation|retirement)', '\bseverance\b', 'workforce reduction', 'hiring freeze']}
      - {name: тарифы, patterns: ['\btariffs?\b']}
      - {name: Китай, patterns: ['\bChina\b', '\bChinese\b']}
      - {name: память, patterns: ['\b(memory|DRAM|HBM)\b']}
  capex_guidance: # ТЗ §19.3a: только где guidance = наш capex (покупка ОС без фин. аренды); вносится вручную после отчёта
    - {ticker: GOOGL, year: 2026, low: 195, high: 205, given: 2026-10-28, source: "звонок GOOGL 2026-10-28, официальная расшифровка"}
  segments: # фаза 5d: сегменты из XBRL-инстанса 10-Q/10-K (LOOKUP S1–S4, 2026-11-01); член оси — без префикса
    NVDA: {revenue: Revenues, profit: OperatingIncomeLoss, members: [{member: ComputeAndNetworkingSegmentMember, label: "Compute & Networking"}, {member: GraphicsSegmentMember, label: "Graphics"}]}
    MSFT: {revenue: RevenueFromContractWithCustomerExcludingAssessedTax, profit: OperatingIncomeLoss, members: [{member: AgentsAndInfraMember, label: "Agents & Infra"} # с FY27
, {member: DevicesAndConsumerMember, label: "Devices & Consumer"}, {member: ProductivityAndBusinessProcessesMember, label: "Productivity & Business Processes"} # до FY26
, {member: IntelligentCloudMember, label: "Intelligent Cloud"}, {member: MorePersonalComputingMember, label: "More Personal Computing"}]}
    AAPL: {revenue: RevenueFromContractWithCustomerExcludingAssessedTax, profit: OperatingIncomeLoss, members: [{member: AmericasSegmentMember, label: "Americas"}, {member: EuropeSegmentMember, label: "Europe"}, {member: GreaterChinaSegmentMember, label: "Greater China"}, {member: JapanSegmentMember, label: "Japan"}, {member: RestOfAsiaPacificSegmentMember, label: "Rest of Asia Pacific"}]}
    AMZN: {revenue: RevenueFromContractWithCustomerExcludingAssessedTax, profit: OperatingIncomeLoss, members: [{member: NorthAmericaSegmentMember, label: "North America"}, {member: InternationalSegmentMember, label: "International"}, {member: AmazonWebServicesSegmentMember, label: "AWS"}]}
    META: {revenue: RevenueFromContractWithCustomerExcludingAssessedTax, profit: OperatingIncomeLoss, members: [{member: FamilyOfAppsMember, label: "Family of Apps"}, {member: RealityLabsMember, label: "Reality Labs"}]}
    GOOGL: {revenue: RevenueFromContractWithCustomerExcludingAssessedTax, profit: OperatingIncomeLoss, members: [{member: GoogleServicesMember, label: "Google Services"}, {member: GoogleCloudMember, label: "Google Cloud"}, {member: AllOtherSegmentsMember, label: "Other Bets"}]}
    AVGO: {revenue: RevenueFromContractWithCustomerExcludingAssessedTax, profit: OperatingIncomeLoss, members: [{member: SemiconductorSolutionsMember, label: "Semiconductor Solutions"}, {member: InfrastructureSoftwareMember, label: "Infrastructure Software"}]}
    TSLA: {revenue: Revenues, profit: GrossProfit, gross: true, members: [{member: AutomotiveSegmentMember, label: "Automotive"}, {member: EnergyGenerationAndStorageSegmentMember, label: "Energy Generation & Storage"}]}
  transcripts: # официальные расшифровки звонков на сайтах IR (LOOKUP R1–R3, 2026-10-30); только текст Outlook
    enabled: true
    request_interval: 10s # robots.txt: Crawl-delay 10
    retry_every: 1h # пока расшифровки нет — не чаще раза в час на отчёт
    window_days: 4 # после 8-K
    companies: # только те, у кого guidance лишь на звонке, а расшифровка — открытый HTML
      - {ticker: MSFT, page: "https://www.microsoft.com/en-us/investor/events/fy-{fy}/earnings-fy-{fy}-q{q}"}
      - {ticker: GOOGL, feed: "https://abc.xyz/feed/FinancialReport.svc/GetFinancialReportList?LanguageId=1&year={fy}"}
earnings_calendar:
  # Даты будущих отчётов — Nasdaq API (решение пользователя 2026-10-25; у Yahoo нужен crumb, LOOKUP E5).
  # «estimated» у Nasdaq — оценка алгоритма, помечается в экспорте. Время — calendar.release_timezone (ET).
  enabled: true
  endpoint: "https://api.nasdaq.com/api/analyst/{ticker}/earnings-date"
  after_close_time: "16:00" # ожидаемая подача 8-K при отчёте после закрытия
  pre_market_time: "07:00"
  unknown_time: "16:00"
# =====================================================================
# КЛАССИФИКАЦИЯ
# =====================================================================
classify:
  # Запасной путь (если Gemini недоступен). Регистр не важен; «слово*» — любое окончание
  # (ставк* → ставка, ставки, ставку); фраза совпадает, если слова идут подряд.
  # Укр./рус. слова утверждены пользователем 2026-10-25.
  min_score: 2
  # Теги постов; тот же набор — в rules и в prompts/classify.md. Порядок разрешает ничьи.
  tags: [usa_monetary, usa_fiscal, usa_micro, usa_politics, energy_geopolitics, eu_ecb, eu_fiscal, eu_macro, eu_micro]
  rules:
    usa_monetary: ["FOMC", "Fed", "Warsh", "Powell", "fed funds", "rate cut", "rate hike", "dot plot", "CPI", "PCE", "PPI", "payrolls", "NFP", "jobless claims", "unemployment", "inflation", "QT", "ФРС", "Ворш*", "Пауелл*", "Пауэлл*", "ставк* ФРС", "зниження ставки", "снижени* ставки", "підвищення ставки", "повышени* ставки", "інфляц*", "инфляц*", "безробітт*", "безработиц*", "зайнятіст*", "занятост*", "заявки на допомогу", "заявки на пособи*", "ВВП США", "роздрібн* продаж*", "розничн* продаж*", "споживч* настр*", "потребительск* настро*"]
    usa_fiscal: ["Treasury", "TGA", "auction", "refunding", "deficit", "debt ceiling", "Bessent", "bills", "coupons", "term premium", "RRP", "reserves", "SOFR", "repo", "Мінфін* США", "Минфин* США", "казначейств*", "Бессент*", "аукціон*", "аукцион*", "дефіцит*", "дефицит*", "держборг*", "госдолг*", "борг* США", "долг* США", "облігаці*", "облигаци*", "трежеріс", "трежерис", "дохідніст*", "доходност*", "ліквідніст*", "ликвидност*", "репо", "шатдаун*"]
    usa_micro: ["earnings", "guidance", "revenue", "EPS", "capex", "NVDA", "Nvidia", "MSFT", "Microsoft", "AAPL", "Apple", "AMZN", "Amazon", "META", "GOOGL", "Alphabet", "AVGO", "Broadcom", "TSLA", "Tesla", "звітніст*", "отчетност*", "виручк*", "выручк*", "прибут*", "прибыл*", "гайденс*", "капекс", "Mag7", "напівпровідник*", "полупроводник*", "OpenAI"]
    usa_politics: ["election*", "Congress*", "midterm*", "White House", "Trump*", "Hassett*", "shutdown*", "tariff*", "вибор*", "выбор*", "конгрес*", "біл* дім", "біл* дом*", "бел* дом*", "Трамп*", "Хассет*", "мідтерм*", "тариф*", "мита", "мито", "митами", "пошлин*"]
    energy_geopolitics: ["oil", "Brent", "WTI", "OPEC*", "Iran*", "Israel*", "Russia*", "sanction*", "нафт*", "нефт*", "ОПЕК*", "Іран*", "Иран*", "Ізраїл*", "Израил*", "Росі*", "Росси*", "санкц*"]
    eu_ecb: ["ECB", "Lagarde", "deposit rate", "HICP", "eurozone inflation", "ЕЦБ", "ЄЦБ", "Лагард*", "депозитн* ставк*", "єврозон* інфляц*", "еврозон* инфляц*"]
    eu_fiscal: ["Bund", "BTP", "OAT", "spread", "Schuldenbremse", "debt brake", "German budget", "defense spending", "Бунд*", "бюджет* Франці*", "бюджет* Франци*", "Італі*", "Итали*", "кредитн* рейтинг*", "боргов* гальм*", "долгов* тормоз*", "оборонн* витрат*", "оборонн* расход*"]
    eu_macro: ["Ifo", "ZEW", "PMI", "Destatis", "German industry", "TTF", "China", "Німеччин*", "Германи*", "єврозон*", "еврозон*", "EUR/USD", "Brent", "Китай*"]
    eu_micro: ["SAP", "Siemens", "Allianz", "Deutsche Telekom", "Airbus", "Mercedes", "DAX", "Stoxx"]
  drop_if_contains: ["розыгрыш", "промокод", "реклама", "подписывайтесь", "скидка", "розіграш", "підпишись", "підписуйтесь", "знижк*"]
  # Основной классификатор (D14). Ключ — только env GEMINI_API_KEY. Без ключа, при ошибке,
  # квоте или невалидном ответе пакет размечается ключевыми словами (rules выше).
  gemini:
    enabled: true
    endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    model: gemini-3.5-flash-lite # LOOKUP M2, подтверждено 2026-10-25
    prompt: "prompts/classify.md" # путь от папки config.yaml; правится без пересборки
    batch_size: 20
    min_confidence: 0.5
    timeout: 60s
    daily_request_limit: 200 # свой предел в сутки (по Тихоокеанскому времени), ниже квоты AI Studio
# Чистка постов в News (FIXES_W44, батч E). Слова и фразы — как в classify.rules: целые слова без учёта
# регистра, «слово*» — любое окончание.
news:
  min_text_chars: 40 # пост короче (после чистки, без эмодзи) — картинка с подписью, не экспортируется
  signature_share: 0.5 # строка в ≥50% постов канала за неделю — подпись канала, вырезается
  signature_min_posts: 4 # при меньшем числе постов канала подписи не ищутся
  promo_words: ["спільнот*", "підписник*", "трансляці*", "подкаст*", "читать бесплатно", "join", "subscribe*", "Market News Bureau"] # строка с ними вырезается
  opinion_markers: ["я бы", "для меня", "на мой взгляд", "я думаю", "базовий сценарій", "I think", "my view", "IMO"] # пост с ними — «мнение», иначе тип канала
  calendar_posts: ["Основні події на ринках сьогодні", "Основні події тижня", "Основные события дня", "Основные события недели", "Главные события дня", "Главные события недели"] # начало анонса календаря — в экспорт не идёт
  global_max: 5 # постов в разделе «Глобально»
  views_refresh: true # перед недельным экспортом перечитать просмотры (и флаг фото) постов недели с t.me/s
  # Новый экспорт USA News (2026-11-03): посты не обрезаются, шум убирается целиком.
  caption_max_chars: 300 # пост с фото короче (без эмодзи), со словом из drop_keywords.caption и без маркеров мнения — подпись к графику, не экспортируется
  opinions_per_channel: 6 # мнений канала целиком (по резонансу за неделю); остальные — строкой «первая фраза + ссылка» в «Ещё мнения (кратко)»; 0 — все. У канала — свой лимит opinions_full
  drop_keywords: # пост с этими словами (и без строки «факт (ожидание)») не экспортируется; причина — в счётчике
    announce: ["вже за", "уже через", "скоро вийде", "скоро выйдет", "незабаром", "stay tuned", "coming soon", "нагадуємо", "напоминаем", "пряма трансляці*", "прямая трансляци*", "дивитись тут", "смотреть тут", "новий випуск", "новый выпуск", "свіжий випуск", "свежий выпуск"]
    caption: ["у додаток до теми", "в дополнение к теме", "ліворуч", "праворуч", "слева", "справа", "на графіку", "на графике", "динаміка", "динамика", "хроніка", "хроника", "chart", "лідирують", "лідирує", "лидируют", "лидирует", "найсильніший", "слабейший", "лузери сесії", "лідери сесії", "heatmap", "теплова карта"] # только для поста с фото короче caption_max_chars
    product: ["представила", "представив", "презентувала", "презентовала", "релізить", "unveil*", "iPad", "iPhone", "MacBook", "iMac", "GTA"] # ещё без «%» и только в AI/отчётах/без тега
  topics: # темы, которых нет среди тегов классификатора
    ai: ["AI", "ШІ", "ИИ", "АІ", "OpenAI", "Anthropic", "ChatGPT", "Gemini", "DeepMind", "LLM", "Nvidia", "NVDA", "напівпровідник*", "полупроводник*", "chip*", "чіп*", "чип*", "дата центр*", "датацентр*", "data center*", "datacenter*", "hyperscaler*", "гіперскейлер*", "гиперскейлер*", "AI capex", "Mag7", "memory", "DRAM", "HBM", "NAND", "памʼяттю", "памʼяті", "пам'яттю", "пам'яті", "пам’яттю", "пам’яті", "памяти", "памятью"] # usa_micro с ними → «AI и техсектор»
    market: ["позиціонуванн*", "позиционировани*", "positioning", "CTA", "COT", "СоТ", "flows", "потоки", "buyback*", "байбек*", "VIX", "breadth", "ширина ринку", "ширина рынка", "пре-маркет", "премаркет", "pre-market", "premarket", "risk on", "risk off", "small cap*", "розкореляці*", "ротаці*", "rotation", "S&P 500", "Nasdaq100", "Nasdaq 100", "Kalshi", "Polymarket", "prediction market*", "BTC", "біткоїн*", "биткоин*", "bitcoin", "crypto*", "крипто*", "stablecoin*", "стейбл*", "Binance", "Coinbase", "Tether", "USDT"] # usa_micro или без тега → «Рынок и позиционирование»
    global: ["НБУ", "BoJ", "Уеда", "Японі*", "Япони*", "Банк Англії", "Банк Англии", "Bank of England", "Британі*", "Британи*", "Commonwealth", "содружеств*", "співдружност*"] # → «Глобально»
  mention_topics_top: 3 # «Растут» — топ-N тем по приросту к прошлой неделе
  mention_topics: # Обзор → «Темы недели в каналах»: посты USA News недели (после чистки), где есть слово темы; синтаксис как classify.rules
    - {name: "Рецессия", words: ["recession*", "рецесі*", "рецесс*", "hard landing", "жорстк* посадк*", "жестк* посадк*"]}
    - {name: "Повышение ставки", words: ["rate hike*", "hike*", "hiking", "підвищен* ставк*", "підвищит* ставк*", "повышен* ставк*", "повысит* ставк*", "повысить ставку"]}
    - {name: "Снижение ставки", words: ["rate cut*", "cut rates", "cutting rates", "знижен* ставк*", "знизит* ставк*", "снижен* ставк*", "снизит* ставк*", "снизить ставку"]}
    - {name: "AI bubble / AI capex", words: ["ai bubble", "ai capex", "capex", "капекс*", "бульбашк* ші", "бульбашк* ai", "пузыр* ии", "пузыр* ai", "дата центр*", "data center*", "datacenter*"]}
    - {name: "Нефть", words: ["oil", "нафт*", "нефт*", "brent", "wti", "opec*", "опек*"]}
    - {name: "Тарифы", words: ["tariff*", "тариф*", "мито", "мита", "митами", "пошлин*"]}
    - {name: "Выборы", words: ["election*", "midterm*", "вибор*", "выбор*"]}
    - {name: "Шатдаун", words: ["shutdown*", "шатдаун*"]}
    - {name: "Кредитный стресс", words: ["credit spread*", "high yield", "junk bond*", "private credit", "default*", "дефолт*", "кредитн* спред*", "кредитн* стрес*", "приватн* кредит*", "частн* кредит*"]}
  surprise_facts: # «Сюрпризы недели»: факт из нашего ряда FRED, если он вышел за неделю; первое совпадение по подписи показателя. Иначе — факт из поста. label — имя показателя в строке поста-ожидания (+ m/m, y/y)
    - {label: "Core CPI", words: ["core cpi", "базов* ІСЦ", "базов* ИПЦ"], when: ["yoy", "y y", "р р", "г г"], series: CPILFESL, transform: yoy, unit: "%"}
    - {label: "Core CPI", words: ["core cpi", "базов* ІСЦ", "базов* ИПЦ"], series: CPILFESL, transform: mom, unit: "%"}
    - {label: "CPI", words: ["cpi", "ІСЦ", "ИПЦ"], when: ["yoy", "y y", "р р", "г г"], series: CPIAUCSL, transform: yoy, unit: "%"}
    - {label: "CPI", words: ["cpi", "ІСЦ", "ИПЦ"], series: CPIAUCSL, transform: mom, unit: "%"}
    - {label: "PPI", words: ["ppi", "ррі", "ІЦВ"], unless: ["core"], when: ["yoy", "y y", "р р", "г г"], series: PPIFIS, transform: yoy, unit: "%"}
    - {label: "PPI", words: ["ppi", "ррі", "ІЦВ"], unless: ["core"], series: PPIFIS, transform: mom, unit: "%"}
    - {label: "Core PCE", words: ["core pce"], when: ["yoy", "y y", "р р", "г г"], series: PCEPILFE, transform: yoy, unit: "%"}
    - {label: "Core PCE", words: ["core pce"], series: PCEPILFE, transform: mom, unit: "%"}
    - {label: "PCE", words: ["pce"], when: ["yoy", "y y", "р р", "г г"], series: PCEPI, transform: yoy, unit: "%"}
    - {label: "Nonfarm Payrolls", words: ["nonfarm payrolls", "nfp", "non farm payrolls"], unless: ["private"], series: PAYEMS, transform: diff, unit: "K"}
    - {label: "Unemployment Rate", words: ["unemployment rate", "рівень безробіття", "уровень безработицы"], series: UNRATE, transform: level, unit: "%"}
    - {label: "Initial Claims", words: ["ijc", "initial jobless", "jobless claims", "initial claims"], series: ICSA, transform: level, scale: 0.001, unit: "K"}
    - {label: "GDP", words: ["gdp", "ВВП"], unless: ["gdpnow"], series: GDPC1, transform: qoqa, unit: "%"}
    - {label: "JOLTS", words: ["jolts"], series: JTSJOL, transform: level, scale: 0.001, unit: "M"}
# =====================================================================
# SENTIMENT — usa/news/sentiment.md (FIXES_W44 батч F, D16)
# =====================================================================
sentiment:
  corr_days: 20 # F2: корреляция дневных доходностей ^NDX и изменений DGS10 за N торговых дней
  regime_threshold: 0.3 # F2: r < −0.3 — «боится инфляции / ставок», r > +0.3 — «боится роста», иначе нейтрально
  ratios: # F4: ширина и ротация (отношение цен закрытия), Δ1w / Δ4w в %
    - {num: RSP, den: SPY, label: "RSP/SPY (равный вес / S&P 500)"}
    - {num: QQEW, den: QQQ, label: "QQEW/QQQ (равный вес / NASDAQ-100)"}
    - {num: IWM, den: SPY, label: "IWM/SPY (малые / большие)"}
    - {num: SMH, den: QQQ, label: "SMH/QQQ (полупроводники / NASDAQ-100)"}
    - {num: XLU, den: SPY, label: "XLU/SPY (коммунальные)"}
    - {num: XLP, den: SPY, label: "XLP/SPY (товары первой необходимости)"}
    - {num: XLE, den: SPY, label: "XLE/SPY (энергетика)"}
  reaction: # F1: реакция цен на события календаря по 1-минутным барам Yahoo (хранятся keep_days)
    symbols:
      - {symbol: "NQ=F", label: "NDX (NQ=F)"}
      - {symbol: "ZT=F", label: "2Y ≈б.п. (ZT=F)", duration: 1.9} # Δдох. ≈ −Δцены% / дюрация × 100 (решение 2026-11-02)
      - {symbol: "DX-Y.NYB", label: "DXY"}
      - {symbol: "CL=F", label: "WTI"}
    window: 30m # первая реакция: цена через 30 мин против цены в момент события
    keep_days: 60 # бары старше — удаляются (Yahoo отдаёт 1m только за 30 дней)
    fetch_delay: 20m # бары грузятся через 20 мин после close, до которого считается реакция
    check_every: 30m # демон: раз в 30 мин ищет события, бары которых пора загрузить
    earnings: true # отчёты компаний Micro из календаря; сюрприз — строки «$TICKER …»
    events: # имя события в календаре → подпись и слова показателя в «Сюрпризах недели» (E2)
      - {name: "Consumer Price Index", label: "CPI", aliases: ["CPI", "ІСЦ", "ИПЦ"]}
      - {name: "Producer Price Index", label: "PPI", aliases: ["PPI", "ІЦВ"]}
      - {name: "Employment Situation", label: "NFP", aliases: ["NFP", "Nonfarm", "Non-Farm", "Payrolls", "Unemployment Rate"]}
      - {name: "Personal Income and Outlays", label: "PCE", aliases: ["PCE"]}
      - {name: "Gross Domestic Product", label: "GDP", aliases: ["GDP", "ВВП"]}
      - {name: "Unemployment Insurance Weekly Claims Report", label: "Claims", aliases: ["IJC", "Initial Jobless", "Jobless Claims"]}
      - {name: "Job Openings and Labor Turnover Survey", label: "JOLTS", aliases: ["JOLTS"]}
      - {name: "FOMC decision", label: "FOMC", aliases: ["Fed Funds", "FOMC"]}
  daily_moves: # G4b: «Крупнейшие дневные движения недели» по дневным закрытиям Yahoo, без календаря
    - {symbol: "^NDX", label: "NDX"}
    - {symbol: "ZT=F", label: "2Y ≈б.п. (ZT=F)", duration: 1.9} # как в reaction
    - {symbol: "DX-Y.NYB", label: "DXY"}
    - {symbol: "CL=F", label: "WTI"}
# =====================================================================
# ПРОГНОЗЫ (фаза 8)
# =====================================================================
forecast:
  enabled: false
  instruments:
    - {name: NASDAQ, price: "^NDX", fallback: NASDAQCOM}
    - {name: GER40, price: "^GDAXI"}
