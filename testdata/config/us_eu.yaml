# Слитый конфиг США + Европа (фаза 11, шаг 20): presets/us-equities.yaml + регион eu и секции Европы из
# presets/eu-equities.yaml по инструкции README «Европа». Тест: грузится и экспортирует оба региона.
timezone: "Europe/Bratislava"
data_dir: "./data" # БД, логи, exchange/, reports/; относительный путь — от папки этого файла
# приоритет: флаг --data-dir > env MACRO_DATA_DIR > data_dir здесь > ./data (D17)
db_path: "${data_dir}/macro.db"
history_start: "2000-01-01"
export:
  exchange_dir: "${data_dir}/exchange"
  reports_dir: "${data_dir}/reports"
  weekly_cron: "0 16 * * 0" # воскресенье 16:00 Europe/Bratislava
  lookback_days: 7
  max_file_chars: 60000
  event_export: immediate # FOMC/ЕЦБ — экспорт сразу после появления документа
# Шаблоны: встроены в бинарник; файлы *.tmpl из этой папки заменяют одноимённые {{define}} (путь — от папки конфига).
# templates_dir: "./my-templates"

# Регионы и агенты (ТЗ §21.3). id региона — папка в exchange/ и reports/ и значение region у постов и событий.
# У агента: id (agent в шапке, reports/<регион>/<неделя>/<id>.md), folder (по умолчанию = id),
# series_tags (значения поля agent: у рядов), texts (fed, treasury), companies (тикеры edgar.companies),
# channels (handle/имя ленты; пусто — все источники региона), reports (файлы).
# У отчёта: report (тип: monetary, fiscal_liquidity, micro, news, sentiment, markets, calendar, key_metrics, fomc_diff),
# file, title, template (по умолчанию = report), таблицы типа — все обязательны, пустая пишется [].
regions:
  - id: usa
    title: "США" # в сообщении доставки: «Недельный экспорт 2026-W46 — США готов»
    index: "^NDX"
    yahoo_poll: "22:30" # Europe/Bratislava, после закрытия США
    agents:
      - id: monetary
        series_tags: [usa_monetary]
        texts: [fed]
        reports:
          - report: monetary
            file: current_week.md
            title: "USA Monetary"
            tables:
              growth: [GDPC1, GDPNOW, GDP, GDPDEF, PCE, NETEXP, PSAVERT]
              sentiment: [UMCSENT, MICH]
              labor: [UNRATE, PAYEMS, ICSA, CCSA, JTSJOL, JTSJOR, U_V, JTSQUR, JTSHIL, CES0500000003, ECIALLCIV, ULCNFB, OPHNFB]
              inflation: [CPIAUCSL, CPILFESL, CUSR0000SAH1, CUSR0000SASL2RS, STICKCPIM159SFRBATL, PPIFIS, PPIFES, WPSFD49116, PCEPI, PCEPILFE]
              expectations: [T5YIE, T5YIFR, T10YIE]
              fed: [DFF, DGS2, M2SL]
              energy: ["CL=F", "NG=F"]
          - {report: fomc_diff, file: fomc_diff.md, title: "USA Monetary"}
      - id: fiscal_liquidity
        series_tags: [usa_fiscal]
        texts: [treasury]
        reports:
          - report: fiscal_liquidity
            file: current_week.md
            title: "USA Fiscal & Liquidity"
            tables:
              liquidity: [WALCL, WDTGAL, TGA_DTS, RRPONTSYD, WRESBAL, NET_LIQUIDITY]
              funding: [SOFR, IORB, SOFR_IORB, RPONTSYD]
              budget: [MTSDS133FMS, MTS_RECEIPTS, MTS_OUTLAYS, GFDEGDQ188S, A091RC1Q027SBEA, GCE]
              curve: [DGS3MO, DGS2, DGS10, DGS30, DFII10, THREEFYTP10, UST_2S10S, UST_3M10Y]
              derived: [NET_LIQUIDITY, SOFR_IORB, UST_2S10S, UST_3M10Y]
      - id: micro
        series_tags: [usa_micro]
        companies: [MSFT, GOOGL, AMZN, META, AAPL, NVDA, AVGO, TSLA]
        reports:
          - {report: micro, file: current_week.md, title: "USA Micro"}
      - id: news
        series_tags: [usa_news]
        reports:
          - report: news
            file: current_week.md
            title: "USA News"
            filtered_file: news_filtered.md
            uncategorized_file: uncategorized.md
            shared: true # общий файл новостей всех регионов (фаза 11): тот же блок — у EU News
            own_tag_prefixes: ["usa_", "eu_"]
            tag_topics: {usa_monetary: fed, usa_fiscal: fiscal, usa_politics: politics, energy_geopolitics: energy, usa_micro: earnings, eu_ecb: europe, eu_fiscal: europe, eu_macro: europe, eu_micro: europe}
          - {report: sentiment, file: sentiment.md, title: "USA Sentiment"}
      - id: master
        series_tags: [usa_master]
        reports:
          - report: markets
            file: markets_usa.md
            title: "USA Markets"
            tables:
              rows: ["^NDX", "NQ=F", "^GSPC", "^VIX", "^MOVE", BAMLH0A0HYM2, BAMLC0A0CM, "DX-Y.NYB", "GC=F", "HG=F", "BTC-USD"]
          - report: calendar
            file: calendar_usa.md
            title: "USA Calendar"
            previous: # релиз FRED → ряд, чьё последнее значение показать как «прошлое»
              10: {series: CPIAUCSL, code: yoy, name: "CPI YoY"}
              11: {series: ECIALLCIV, code: yoy, name: "ECI YoY"}
              20: {series: WALCL, code: level, name: "WALCL"}
              46: {series: PPIFIS, code: yoy, name: "PPI YoY"}
              50: {series: PAYEMS, code: diff, name: "NFP"}
              53: {series: GDPC1, code: qoqa, name: "Real GDP QoQa"}
              54: {series: PCEPILFE, code: yoy, name: "Core PCE YoY"}
              91: {series: UMCSENT, code: level, name: "UMCSENT"}
              180: {series: ICSA, code: level, name: "ICSA"}
              192: {series: JTSJOL, code: level, name: "JOLTS"}
              363: {series: MTSDS133FMS, code: level, name: "дефицит"}
              386: {series: GDPNOW, code: level, name: "GDPNow"}
          - report: key_metrics
            file: key_metrics_usa.md
            title: "USA Key Metrics"
            sentiment_rows: true # + VIX/VIX3M, put/call акций, RSP/SPY, P(рецессия, Kalshi) — из sentiment.md
            rows:
              - {label: "Net Liquidity", id: NET_LIQUIDITY}
              - {label: "Fed Funds (эффективная)", id: DFF}
              - {label: "Траектория ставки (ZQ)", id: FED_PATH}
              - {label: "UST 2Y", id: DGS2}
              - {label: "UST 10Y", id: DGS10}
              - {label: "Real Yield 10Y", id: DFII10}
              - {label: "Term Premium 10Y", id: THREEFYTP10}
              - {label: "Core PCE 3mA", id: PCEPILFE, code: a3m}
              - {label: "Core CPI 3mA", id: CPILFESL, code: a3m}
              - {label: "Unemployment Rate", id: UNRATE}
              - {label: "Initial Claims", id: ICSA}
              - {label: "HY-спред", id: BAMLH0A0HYM2}
              - {label: "VIX", id: "^VIX"}
              - {label: "MOVE", id: "^MOVE"}
              - {label: "NASDAQ 100", id: "^NDX"}
    # Страницы дашборда (ТЗ §21.4), порядок = порядок меню. kind: line | bar | curve.
    # ref — source/id ряда из этого конфига, transform — код из metrics (по умолчанию level).
    dashboard:
      pages:
        - id: overview
          title: "Обзор"
          views: [{view: key_metrics}, {view: status}]
        - id: liquidity
          title: "Ликвидность"
          charts:
            - {title: "Net Liquidity", kind: line, series: [{ref: derived/NET_LIQUIDITY}]}
            - title: "Составляющие"
              kind: line
              series: [{ref: fred/WALCL}, {ref: fred/WDTGAL}, {ref: fred/RRPONTSYD}, {ref: fred/WRESBAL}]
            - {title: "SOFR − IORB", kind: line, series: [{ref: derived/SOFR_IORB}]}
        - id: rates
          title: "Ставки"
          charts:
            - title: "Кривая UST: сейчас и 4 недели назад"
              kind: curve
              compare_days: 28
              series:
                - {ref: fred/DGS3MO, label: "3M"}
                - {ref: fred/DGS2, label: "2Y"}
                - {ref: fred/DGS10, label: "10Y"}
                - {ref: fred/DGS30, label: "30Y"}
            - title: "Доходности"
              kind: line
              series: [{ref: fred/DGS2}, {ref: fred/DGS10}, {ref: fred/DFII10}, {ref: fred/THREEFYTP10}]
            - {title: "Спред 2s10s", kind: line, series: [{ref: derived/UST_2S10S}]}
          views: [{view: fed_path}]
        - id: inflation-labor
          title: "Инфляция и труд"
          charts:
            - title: "Инфляция, YoY"
              kind: line
              series:
                - {ref: fred/CPIAUCSL, transform: yoy, label: "CPI"}
                - {ref: fred/CPILFESL, transform: yoy, label: "Core CPI"}
                - {ref: fred/PCEPILFE, transform: yoy, label: "Core PCE"}
            - title: "Инфляция, 3 мес. в годовом выражении"
              kind: line
              series:
                - {ref: fred/CPILFESL, transform: a3m, label: "Core CPI 3mA"}
                - {ref: fred/PCEPILFE, transform: a3m, label: "Core PCE 3mA"}
            - {title: "Безработица", kind: line, series: [{ref: fred/UNRATE}]}
            - title: "Заявки на пособие"
              kind: line
              series:
                - {ref: fred/ICSA, label: "Initial Claims"}
                - {ref: fred/ICSA, transform: avg4w, label: "Initial Claims, 4 нед."}
            - {title: "U/V", kind: line, series: [{ref: derived/U_V}]}
        - id: fiscal
          title: "Фискал"
          charts:
            - {title: "Дефицит бюджета, сумма за 12 мес.", kind: bar, series: [{ref: fred/MTSDS133FMS, transform: sum12m}]}
            - {title: "Процентные выплаты", kind: line, series: [{ref: fred/A091RC1Q027SBEA}]}
          views: [{view: supply}, {view: auctions}]
        - id: micro
          title: "Micro"
          views: [{view: capex}, {view: financials}]
        - id: reactions
          title: "Реакции"
          views: [{view: event_reactions}, {view: reactions}, {view: surprises}]
        - id: news-sentiment
          title: "News и Sentiment"
          charts:
            - {title: "Волатильность", kind: line, series: [{ref: "yahoo/^VIX"}, {ref: "yahoo/^MOVE"}]}
            - {title: "Ширина рынка: RSP/SPY", kind: line, series: [{ref: "ratio/RSP:SPY"}]}
          views: [{view: news_feed}, {view: topics}]
        - id: calendar
          title: "Календарь"
          views: [{view: calendar}]
        - id: reports
          title: "Отчёты"
          views: [{view: reports}]
  - id: eu
    title: "Европа" # в сообщении доставки
    index: "^GDAXI"
    yahoo_poll: "18:00" # Europe/Bratislava, после закрытия Xetra (ТЗ §8.3)
    timezone: "Europe/Berlin" # своя зона региона: вторая колонка времени calendar_eu.md, дни релизов (ТЗ §17.8)
    timezone_label: "CET/CEST"
    agents:
      - id: monetary_macro
        folder: monetary_macro
        series_tags: [eu_monetary]
        texts: [ecb_texts]
        reports:
          # тот же вид отчёта, что USA Monetary; шаблон Европы — без траектории ZQ и текстов ФРС (они у агента,
          # который читает тексты fed), с текстами ЕЦБ. fed — ставки, баланс и ликвидность ЕЦБ; credit (необязательная
          # таблица, батч 11f) — деньги, кредит, ставки по кредитам, BLS; energy — котировки Yahoo, в том числе валюты.
          - report: monetary
            file: current_week.md
            title: "EU Monetary & Macro"
            template: monetary_eu
            tables:
              growth: [GDP_EA, GDP_EA_NOM, GDP_EA_DEFL, CONS_EA, NETEXP_EA, SAVING_EA, GDP_DE, GDP_FR, GDP_IT, GDP_ES, IP_EA, RETAIL_EA, DE_ORDERS, DE_PRODUCTION]
              sentiment: [EC_ESI_EA, EC_CONS_EA, EC_SERV_EA, EC_ICI_DE, EC_ESI_DE, ZEW_SENTIMENT, ZEW_SITUATION, IFO_CLIMATE, IFO_EXPECTATIONS]
              labor: [UNEMP_EA, UNEMP_DE, UNEMP_FR, UNEMP_IT, UNEMP_ES, EMPL_EA, JOBVAC_EA, NEG_WAGES, WAGE_TRACKER, LCI_EA, ULC_EA, PROD_EA]
              inflation: [HICP, HICP_CORE, HICP_SA, HICP_CORE_SA, HICP_SERV, HICP_NEIG, HICP_ENERGY, HICP_FOOD, HICP_DE, HICP_FR, HICP_IT, HICP_ES, PPI_EA, PPI_EA_CORE]
              expectations: [CES_1Y, CES_3Y, SPF_NEXT_YEAR, SPF_LT, EC_PRICE_EXP]
              fed: [ECB_DFR, ESTR, ESTR_DFR, ECB_ASSETS, EXCESS_LIQ, ILM_GOV_DEP]
              credit: [M3_YOY, LOANS_NFC_YOY, LOANS_HH_YOY, MIR_NFC, MIR_HOUSE, BLS_NFC_STD, BLS_NFC_DEM, BLS_HH_STD, BLS_HH_DEM]
              energy: ["TTF=F", "BZ=F", "EURUSD=X", "CNY=X"]
          - {report: ecb_diff, file: ecb_diff.md, title: "EU Monetary & Macro", max_chars: 100000}
      - id: fiscal_bonds
        folder: fiscal_bonds
        series_tags: [eu_fiscal]
        reports:
          # государственные облигации: кривая Bund, спреды (MTS, derived), месячные 10Y ЕЦБ, долг и дефицит,
          # аукционы Bund (секция finanzagentur с agent: eu_fiscal) — недели и следующей недели
          - report: fiscal_bonds
            file: current_week.md
            title: "EU Fiscal & Bonds"
            tables:
              curve: [BUND_2Y, BUND_5Y, BUND_10Y, BUND_30Y, BUND_2S10S, ECB_YC_AAA_10Y, ECB_YC_ALL_10Y]
              spreads: [BTP_BUND, OAT_BUND, UST_BUND, ECB_ALL_AAA_10Y, "MIT10.AS", "MFR10.AS", "MDE10.AS"]
              monthly: [IRS_IT_10Y, IRS_FR_10Y, IRS_ES_10Y, IRS_DE_10Y]
              debt: [EA_DEBT_GDP, DE_DEBT_GDP, FR_DEBT_GDP, IT_DEBT_GDP, ES_DEBT_GDP, EA_DEFICIT_GDP, FR_DEFICIT_GDP, IT_DEFICIT_GDP, ES_DEFICIT_GDP, EA_INTEREST_GDP, TARGET_IT, TARGET_DE]
      - id: micro
        series_tags: [eu_micro]
        companies: [SAP, SIE, ALV, AIR, DTE, ENR, RHM, MBG]
        reports:
          # EU Micro (ТЗ §18.7): цены и реакция на отчёт по всем восьми, даты отчётов из секции issuers,
          # годовые цифры SAP (EDGAR 20-F) и Airbus (ESEF), пресс-релизы — абзацы outlook и цитаты.
          - {report: micro_annual, file: current_week.md, title: "EU Micro"}
      - id: news
        series_tags: [eu_news]
        reports:
          # Файл новостей общий с USA News (решение пользователя 2026-11-10): тот же блок отчёта, что в пресете
          # США, — тело файлов одинаково, отличаются шапка и заголовок. sentiment.md — свой, по европейским активам.
          - report: news
            file: current_week.md
            title: "EU News"
            filtered_file: news_filtered.md
            uncategorized_file: uncategorized.md
            shared: true
            own_tag_prefixes: ["usa_", "eu_"]
            tag_topics: {usa_monetary: fed, usa_fiscal: fiscal, usa_politics: politics, energy_geopolitics: energy, usa_micro: earnings, eu_ecb: europe, eu_fiscal: europe, eu_macro: europe, eu_micro: europe}
          - report: sentiment
            file: sentiment.md
            title: "EU Sentiment"
            template: sentiment_eu
            # Свой блок вместо верхнего sentiment (ТЗ §12.6, «Европа»). Put/call и ширины рынка по Европе бесплатных
            # нет; COT Euro FX — в markets_eu.md мастера (секция cftc, agent: eu_master).
            sentiment:
              sections: [reaction, moves, regime, volatility]
              corr_days: 20
              regime_threshold: 0.3
              regime: {equity: "^GDAXI", rates: BUND_10Y} # r(GER40, Δ Bund 10Y)
              volatility: [VDAX_NEW, VSTOXX]
              vol_ratio: {num: VDAX_NEW, den: "^VIX", label: "VDAX/VIX", inversion: false}
              put_call: false
              reaction:
                symbols:
                  - {symbol: "^GDAXI", label: "GER40"}
                  - {series: BUND_10Y, label: "Bund 10Y б.п."} # минутных баров нет: Δ за день (Бундесбанк), решение 2026-11-11
                  - {symbol: "EURUSD=X", label: "EUR/USD"}
                window: 30m
                close: "17:30" # Xetra; событие после 17:30 — до закрытия следующего дня
                timezone: "Europe/Berlin"
                keep_days: 60
                fetch_delay: 20m
                check_every: 30m
                earnings: true # отчёты компаний EU Micro (даты из конфига)
                events:
                  - {name: "Флеш HICP еврозоны", label: "HICP флеш", aliases: ["HICP", "інфляці* єврозон*", "инфляци* еврозон*"]}
                  - {name: "Флеш ВВП еврозоны", label: "ВВП EZ флеш", aliases: ["GDP", "ВВП єврозон*", "ВВП еврозон*"]}
                  - {name: "ZEW (Германия)", label: "ZEW", aliases: ["ZEW"]}
                  - {name: "Опрос Еврокомиссии (ESI, confidence)", label: "ЕК опрос", aliases: ["ESI", "economic sentiment"]}
                  - {name: "ECB decision", label: "ЕЦБ", aliases: ["ECB", "ЄЦБ", "ЕЦБ", "deposit rate"]}
                  # события США двигают GER40 и EUR/USD (решение пользователя 2026-11-11); есть в календаре, только если в конфиге регион usa
                  - {name: "Consumer Price Index", label: "US CPI", aliases: ["CPI", "ІСЦ", "ИПЦ"], region: usa}
                  - {name: "Employment Situation", label: "US NFP", aliases: ["NFP", "Nonfarm", "Payrolls"], region: usa}
                  - {name: "FOMC decision", label: "FOMC", aliases: ["FOMC", "Fed Funds"], region: usa}
              daily_moves:
                - {symbol: "^GDAXI", label: "GER40"}
                - {series: BUND_10Y, label: "Bund 10Y б.п."}
                - {symbol: "EURUSD=X", label: "EUR/USD"}
                - {symbol: "TTF=F", label: "TTF"}
      - id: master
        series_tags: [eu_master]
        reports:
          - report: markets
            file: markets_eu.md
            title: "EU Markets"
            tables:
              rows: [ECB_DFR, ESTR, ECB_ASSETS, HICP, HICP_CORE, HICP_SA, HICP_CORE_SA, HICP_DE, ECB_YC_AAA_10Y, ECB_YC_ALL_10Y, IRS_IT_10Y, IRS_FR_10Y, IRS_DE_10Y, BUND_2Y, BUND_10Y, BUND_30Y, DE_ORDERS, DE_PRODUCTION, GDP_EA, GDP_DE, DE_DEBT_GDP, IT_DEFICIT_GDP, EC_ICI_DE, EC_ESI_DE, VDAX_NEW, VSTOXX, ZEW_SENTIMENT, ZEW_SITUATION, "^GDAXI", "^STOXX50E", "EURUSD=X", "CNY=X", "BZ=F", "TTF=F", "MIT10.AS", "MFR10.AS", "MDE10.AS", BTP_BUND, OAT_BUND, UST_BUND, BUND_2S10S, ECB_ALL_AAA_10Y, GER40_NDX, IFO_CLIMATE, IFO_EXPECTATIONS, UNEMP_EA, M3_YOY, CES_1Y, SPF_LT, BUND_5Y, CISS, EUR_NEER, EURGBP, EURJPY]
          - {report: calendar, file: calendar_eu.md, title: "EU Calendar"}
          # 12 строк ТЗ §12.7; строк сентимента США (sentiment_rows) нет
          - report: key_metrics
            file: key_metrics_eu.md
            title: "EU Key Metrics"
            rows:
              - {label: "Deposit Rate (ЕЦБ)", id: ECB_DFR}
              - {label: "HICP core 3mA", id: HICP_CORE_SA, code: a3m}
              - {label: "Bund 10Y", id: BUND_10Y}
              - {label: "BTP-Bund 10Y", id: BTP_BUND}
              - {label: "UST-Bund 10Y", id: UST_BUND}
              - {label: "DE industrial confidence (EC)", id: EC_ICI_DE}
              - {label: "ZEW Economic Sentiment", id: ZEW_SENTIMENT}
              - {label: "TTF", id: "TTF=F"}
              - {label: "EUR/USD", id: "EURUSD=X"}
              - {label: "VDAX-NEW (STOXX)", id: VDAX_NEW}
              - {label: "GER40", id: "^GDAXI"}
              - {label: "GER40/NDX", id: GER40_NDX}
    # Страницы дашборда Европы (ТЗ §21.4), порядок = порядок меню; как у США. Виды capex, financials, reactions,
    # fed_path, auctions, supply читают отчёты США (micro, monetary с ZQ, fiscal_liquidity) — у Европы их нет.
    dashboard:
      pages:
        - id: overview
          title: "Обзор"
          views: [{view: key_metrics}, {view: status}]
        - id: ecb
          title: "ЕЦБ и инфляция"
          charts:
            - {title: "Ставки ЕЦБ", kind: line, series: [{ref: ecb/ECB_DFR}, {ref: ecb/ESTR}]}
            - title: "HICP, YoY"
              kind: line
              series:
                - {ref: ecb/HICP, transform: yoy, label: "HICP"}
                - {ref: ecb/HICP_CORE, transform: yoy, label: "HICP core"}
                - {ref: ecb/HICP_DE, transform: yoy, label: "HICP Германия"}
            - {title: "HICP core, 3 мес. в годовом выражении", kind: line, series: [{ref: ecb/HICP_CORE_SA, transform: a3m, label: "HICP core 3mA"}]}
            - {title: "Баланс Евросистемы", kind: line, series: [{ref: ecb/ECB_ASSETS}]}
            - title: "HICP по компонентам, YoY"
              kind: line
              series:
                - {ref: ecb/HICP_SERV, transform: yoy, label: "Услуги"}
                - {ref: ecb/HICP_NEIG, transform: yoy, label: "Промтовары"}
                - {ref: ecb/HICP_ENERGY, transform: yoy, label: "Энергия"}
                - {ref: ecb/HICP_FOOD, transform: yoy, label: "Еда"}
            - title: "HICP по странам, YoY"
              kind: line
              series:
                - {ref: ecb/HICP_DE, transform: yoy, label: "Германия"}
                - {ref: ecb/HICP_FR, transform: yoy, label: "Франция"}
                - {ref: ecb/HICP_IT, transform: yoy, label: "Италия"}
                - {ref: ecb/HICP_ES, transform: yoy, label: "Испания"}
            - title: "Инфляционные ожидания"
              kind: line
              series: [{ref: ecb/CES_1Y, label: "Потребители, 12 мес."}, {ref: ecb/CES_3Y, label: "Потребители, 3 года"}, {ref: ecb/SPF_NEXT_YEAR, label: "SPF, следующий год"}, {ref: ecb/SPF_LT, label: "SPF, долгосрок"}]
            - {title: "PPI еврозоны, YoY", kind: line, series: [{ref: eurostat/PPI_EA, transform: yoy, label: "PPI"}, {ref: eurostat/PPI_EA_CORE, transform: yoy, label: "PPI без энергии"}]}
            - {title: "Избыточная ликвидность (≈)", kind: line, series: [{ref: derived/EXCESS_LIQ}]}
            - {title: "€STR − ставка по депозитам", kind: line, series: [{ref: derived/ESTR_DFR}]}
        - id: bonds
          title: "Облигации"
          charts:
            - title: "Кривая Bund: сейчас и 4 недели назад"
              kind: curve
              compare_days: 28
              series:
                - {ref: bundesbank/BUND_2Y, label: "2Y"}
                - {ref: bundesbank/BUND_5Y, label: "5Y"}
                - {ref: bundesbank/BUND_10Y, label: "10Y"}
                - {ref: bundesbank/BUND_30Y, label: "30Y"}
            - {title: "Спреды к Bund 10Y", kind: line, series: [{ref: derived/BTP_BUND}, {ref: derived/OAT_BUND}, {ref: derived/UST_BUND}]}
            - {title: "Bund 2s10s", kind: line, series: [{ref: derived/BUND_2S10S}]}
            - {title: "Кривые ЕЦБ 10Y: AAA и все эмитенты", kind: line, series: [{ref: ecb/ECB_YC_AAA_10Y}, {ref: ecb/ECB_YC_ALL_10Y}]}
            - title: "Госдолг, % ВВП"
              kind: line
              series: [{ref: eurostat/EA_DEBT_GDP, label: "Еврозона"}, {ref: eurostat/DE_DEBT_GDP, label: "Германия"}, {ref: eurostat/FR_DEBT_GDP, label: "Франция"}, {ref: eurostat/IT_DEBT_GDP, label: "Италия"}, {ref: eurostat/ES_DEBT_GDP, label: "Испания"}]
            - {title: "TARGET: Италия и Германия", kind: line, series: [{ref: ecb/TARGET_IT, label: "Италия"}, {ref: ecb/TARGET_DE, label: "Германия"}]}
        - id: economy
          title: "Экономика"
          charts:
            - {title: "ZEW", kind: line, series: [{ref: zew/ZEW_SENTIMENT}, {ref: zew/ZEW_SITUATION}]}
            # баланс (около нуля) и индекс (около 100) — на разных графиках: на одной оси баланс выглядит плоским
            - {title: "Промышленное доверие DE (ЕК), баланс", kind: line, series: [{ref: eurostat/EC_ICI_DE}]}
            - {title: "Экономические настроения DE (ЕК, ESI), индекс", kind: line, series: [{ref: eurostat/EC_ESI_DE}]}
            - title: "Заказы и промпроизводство DE, YoY"
              kind: line
              series:
                - {ref: bundesbank/DE_ORDERS, transform: yoy, label: "Заказы"}
                - {ref: bundesbank/DE_PRODUCTION, transform: yoy, label: "Промпроизводство"}
            - title: "Реальный ВВП, YoY"
              kind: bar
              series: [{ref: eurostat/GDP_EA, transform: yoy, label: "Еврозона"}, {ref: eurostat/GDP_DE, transform: yoy, label: "Германия"}, {ref: eurostat/GDP_FR, transform: yoy, label: "Франция"}, {ref: eurostat/GDP_IT, transform: yoy, label: "Италия"}, {ref: eurostat/GDP_ES, transform: yoy, label: "Испания"}]
            - {title: "Промпроизводство и розница еврозоны, YoY", kind: line, series: [{ref: eurostat/IP_EA, transform: yoy, label: "Промпроизводство"}, {ref: eurostat/RETAIL_EA, transform: yoy, label: "Розница"}]}
            - {title: "Настроения еврозоны (ЕК)", kind: line, series: [{ref: eurostat/EC_CONS_EA, label: "Потребители"}, {ref: eurostat/EC_SERV_EA, label: "Услуги"}]}
            - {title: "ESI еврозоны (ЕК), индекс", kind: line, series: [{ref: eurostat/EC_ESI_EA}]}
        - id: labor
          title: "Рынок труда"
          charts:
            - title: "Безработица"
              kind: line
              series: [{ref: eurostat/UNEMP_EA, label: "Еврозона"}, {ref: eurostat/UNEMP_DE, label: "Германия"}, {ref: eurostat/UNEMP_FR, label: "Франция"}, {ref: eurostat/UNEMP_IT, label: "Италия"}, {ref: eurostat/UNEMP_ES, label: "Испания"}]
            - {title: "Занятость еврозоны", kind: line, series: [{ref: eurostat/EMPL_EA}]}
            - title: "Зарплаты и стоимость труда, YoY"
              kind: line
              series: [{ref: ecb/NEG_WAGES, label: "Переговорные зарплаты"}, {ref: eurostat/LCI_EA, transform: yoy, label: "Индекс стоимости труда"}, {ref: eurostat/ULC_EA, transform: yoy, label: "Удельные затраты на труд"}]
            - {title: "Доля вакансий", kind: line, series: [{ref: eurostat/JOBVAC_EA}]}
            - {title: "Wage tracker ЕЦБ: факт", kind: line, series: [{ref: ecb/WAGE_TRACKER, part: actual, label: "Wage tracker, г/г"}]}
            - {title: "Wage tracker ЕЦБ: прогноз по подписанным договорам", kind: line, series: [{ref: ecb/WAGE_TRACKER, part: forecast, label: "Прогноз трекера, г/г"}]}
        - id: credit
          title: "Деньги и кредит"
          charts:
            - title: "M3 и кредиты, YoY"
              kind: line
              series: [{ref: ecb/M3_YOY, label: "M3"}, {ref: ecb/LOANS_NFC_YOY, label: "Кредиты бизнесу"}, {ref: ecb/LOANS_HH_YOY, label: "Кредиты домохозяйствам"}]
            - {title: "Стоимость кредита", kind: line, series: [{ref: ecb/MIR_NFC, label: "Бизнесу"}, {ref: ecb/MIR_HOUSE, label: "Ипотека"}]}
            - title: "Опрос банков (BLS): кредиты бизнесу"
              kind: line
              series: [{ref: ecb/BLS_NFC_STD, label: "Стандарты (> 0 — ужесточение)"}, {ref: ecb/BLS_NFC_DEM, label: "Спрос"}]
            - title: "Опрос банков (BLS): ипотека"
              kind: line
              series: [{ref: ecb/BLS_HH_STD, label: "Стандарты"}, {ref: ecb/BLS_HH_DEM, label: "Спрос"}]
        - id: micro
          title: "Micro"
          views: [{view: issuers}]
        - id: markets
          title: "Рынки"
          charts:
            - {title: "GER40 и STOXX 50", kind: line, series: [{ref: "yahoo/^GDAXI"}, {ref: "yahoo/^STOXX50E"}]}
            - {title: "Волатильность", kind: line, series: [{ref: stoxx/VDAX_NEW}, {ref: stoxx/VSTOXX}]}
            - {title: "EUR/USD", kind: line, series: [{ref: "yahoo/EURUSD=X"}]}
            - {title: "Газ TTF", kind: line, series: [{ref: "yahoo/TTF=F"}]}
            - {title: "Индекс системного стресса ЕЦБ (CISS)", kind: line, series: [{ref: ecb/CISS}]}
            - {title: "Евро: эффективный курс (EER-40)", kind: line, series: [{ref: ecb/EUR_NEER}]}
        - id: reactions
          title: "Реакции"
          views: [{view: event_reactions}, {view: surprises}]
        - id: news-sentiment
          title: "News и Sentiment"
          views: [{view: news_feed}, {view: topics}]
        - id: calendar
          title: "Календарь"
          views: [{view: calendar}]
        - id: reports
          title: "Отчёты"
          views: [{view: reports}]
