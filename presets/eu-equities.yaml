stoxx:
  # Текстовые файлы истории индексов STOXX («Date;Symbol;Indexvalue», вся история в одном файле); key — имя файла.
  # У Yahoo VDAX-NEW и VSTOXX нет. Условия использования не прочитаны — в демо закрыт (D25).
  enabled: true
  endpoint: "https://www.stoxx.com/document/Indices/Current/HistoricalData"
  poll_cron: "0 19 * * 1-5"           # Europe/Bratislava, после закрытия
  series:
    - { id: VDAX_NEW, key: "h_v1x.txt",  agent: eu_master, label: "VDAX-NEW", frequency: d, units: "Index Points", transforms: [level, d1w, d4w, z] }
    - { id: VSTOXX,   key: "h_v2tx.txt", agent: eu_master, label: "VSTOXX",   frequency: d, units: "Index Points", transforms: [level, d1w, d4w, z] }

zew:
  # ZEW Finanzmarkttest: konjunktur.xls (старый двоичный Excel), лист data; key — заголовок столбца.
  # Файл проверяется целиком: значения −100…+100, месяцы подряд; не прошёл — ошибка в status, в БД ничего
  # (запасной путь — macroctl input). robots.txt: Crawl-delay 15 — один запрос на опрос. Релиз 11:05 Europe/Berlin.
  # Перепечатка — с согласия ZEW: в демо закрыт (D25).
  enabled: true
  endpoint: "https://www.zew.de/fileadmin/FTP/div/konjunktur.xls"
  sheet: "data"
  poll_cron: "10 11 * * *"            # Europe/Bratislava
  series:
    - { id: ZEW_SENTIMENT, key: "ZEW Indicator of Economic Sentiment Germany, balances", agent: eu_monetary, label: "ZEW Economic Sentiment (DE)", frequency: m, units: "Balance", transforms: [level, d] }
    - { id: ZEW_SITUATION, key: "Economic Situation Germany, balances",                  agent: eu_monetary, label: "ZEW Economic Situation (DE)", frequency: m, units: "Balance", transforms: [level, d] }

manual:
  # Ручной ввод: macroctl input <id> <значение> --period YYYY-MM  → source=manual, в отчётах пометка «ручной ввод».
  # Ifo: сайт ifo.de закрыт проверкой от ботов, у Бундесбанка и DBnomics ряда нет (D25).
  # release_dates — дни выхода (YYYY-MM-DD): через сутки после такого дня ряд без нового значения помечается stale.
  series:
    - { id: IFO_CLIMATE,      agent: eu_monetary, label: "Ifo Business Climate (DE, 2015=100)", frequency: m, units: "Index", transforms: [level, d],
        release_dates: [] }   # [[FILL: даты выхода Ifo на ближайшие полгода — с ifo.de]]
    - { id: IFO_EXPECTATIONS, agent: eu_monetary, label: "Ifo Expectations (DE, 2015=100)",     frequency: m, units: "Index", transforms: [level, d],
        release_dates: [] }   # [[FILL: те же даты]]
  # Напоминание бота (фаза 14c, D29): по будням в time, пока значения за текущий месяц нет хотя бы у одного
  # ряда — с первой даты месяца из release_dates, а если дат на месяц нет, с from_day. Ответ — числа в порядке
  # series (reply на напоминание) или «ifo 88.4 91.2 [ГГГГ-ММ]». Нужен notify.telegram_bot. Без секции — только macroctl input.
  reminder: { name: Ifo, series: [IFO_CLIMATE, IFO_EXPECTATIONS], from_day: 20, time: "10:05", timezone: Europe/Berlin,
              hint: "пресс-релиз ifo о Geschäftsklima в день выхода (ifo.de): климат и ожидания, 2015=100" }

finanzagentur:
  # Аукционы Bund (ТЗ §6.1, LOOKUP 2026-11-11): итоги текущего года, история с 1999 (backfill),
  # страница календаря со ссылкой на план аукционов (имя файла меняется каждый квартал).
  # Приём заявок 08:00–11:30 Europe/Berlin; строки OH (из собственных запасов) и Syn не аукционы — пропускаются.
  enabled: true
  results_url: "https://www.deutsche-finanzagentur.de/fileadmin/user_upload/Institutionelle-investoren/auktionen/emissionsergebnisse_aktuell_en.xlsx"
  history_url: "https://www.deutsche-finanzagentur.de/fileadmin/user_upload/Institutionelle-investoren/auktionen/emissionshistorie_en.xlsx"
  calendar_page: "https://www.deutsche-finanzagentur.de/en/federal-securities/issuances/issuance-calendar"
  agent: eu_fiscal
  poll_cron: "30 13 * * 1-5"   # Europe/Bratislava; страховочный опрос (D8), в день аукциона — событие календаря
  timezone: "Europe/Berlin"    # дни аукционов и конец приёма заявок (11:30)
  # какие бумаги плана аукционов (Issuance outlook) идут в календарь и с какой важностью; Bubill — нет (по 2–3 в неделю)
  calendar_importance: { Bund: medium, Bobl: medium, Schatz: low, "Green issue": low }

# Календари публикаций, известные датами (ТЗ §8.1; LOOKUP 2026-11-11, PROGRESS «Фаза 11, батч 11d»).
# kind: ics (Eurostat, только даты) | ecb_statscal (страница ЕЦБ, дата и время) | dates (даты в конфиге: PDF издателя).
# match — название события у издателя дословно; series — ряды, которые выходят в этот релиз: в день события
# демон опрашивает их источник, событие закрывается, когда ряды обновились; по этим дням считается stale (§17.7).
# previous — что показать в calendar_eu.md как «Прошлое значение». Destatis не используется (сайт закрыт от ботов).
release_calendars:
  - name: eurostat
    horizon_days: 120   # квартальные релизы (стоимость труда, ULC, BLS) — дальше общего горизонта; нужно для флага stale
    kind: ics
    url: "https://ec.europa.eu/eurostat/o/calendars/eventsIcal?theme=0&category=0"
    agent: eu_monetary
    timezone: "Europe/Luxembourg"
    time: "11:00"   # первые публикации Eurostat — 11:00 CET (протокол беспристрастного доступа)
    events:
      # HICP хранится из ЕЦБ (поток HICP): ЕЦБ обновляет его в 15:00 (флеш) и 12:00 (итог) — опрос это покрывает
      - { match: "Flash estimate inflation euro area", name: "Флеш HICP еврозоны", importance: high,
          series: [HICP, HICP_CORE], previous: { series: HICP, code: yoy, name: "HICP г/г" } }
      - { match: "Inflation (HICP)", name: "HICP еврозоны (итог)", importance: medium,
          series: [HICP, HICP_CORE, HICP_SA, HICP_CORE_SA], previous: { series: HICP_CORE, code: yoy, name: "HICP core г/г" } }
      - { match: "Flash estimate GDP and employment - EU and euro area", name: "Флеш ВВП еврозоны", importance: high,
          series: [GDP_EA, EMPL_EA], previous: { series: GDP_EA, code: qoq, name: "ВВП кв/кв" } }
      - { match: "GDP main aggregates and employment", name: "ВВП еврозоны (основные агрегаты)", importance: medium,
          series: [GDP_EA, GDP_DE, GDP_FR, GDP_IT, GDP_ES, GDP_EA_NOM, GDP_EA_DEFL, CONS_EA, EXPORTS_EA, IMPORTS_EA, NETEXP_EA, EMPL_EA, ULC_EA, PROD_EA],
          previous: { series: GDP_EA, code: qoq, name: "ВВП кв/кв" } }
      # батч 11f: релизы рядов паритета (заголовки — из .ics Eurostat, testdata/relcal/eurostat.ics)
      - { match: "Unemployment", name: "Безработица еврозоны", importance: medium,
          series: [UNEMP_EA, UNEMP_DE, UNEMP_FR, UNEMP_IT, UNEMP_ES], previous: { series: UNEMP_EA, code: level, name: "безработица EA" } }
      - { match: "Industrial production", name: "Промпроизводство еврозоны", importance: medium,
          series: [IP_EA], previous: { series: IP_EA, code: yoy, name: "промпр. г/г" } }
      - { match: "Retail trade", name: "Розничные продажи еврозоны", importance: low,
          series: [RETAIL_EA], previous: { series: RETAIL_EA, code: yoy, name: "розница г/г" } }
      - { match: "Industrial producer prices, domestic market", name: "PPI еврозоны", importance: low,
          series: [PPI_EA, PPI_EA_CORE], previous: { series: PPI_EA, code: yoy, name: "PPI г/г" } }
      - { match: "Labour cost index", name: "Индекс стоимости труда", importance: medium,
          series: [LCI_EA], previous: { series: LCI_EA, code: yoy, name: "стоимость труда г/г" } }
      - { match: "Job vacancy", name: "Вакансии", importance: low,
          series: [JOBVAC_EA], previous: { series: JOBVAC_EA, code: level, name: "доля вакансий" } }
      - { match: "First release sector accounts (households and businesses)", name: "Счета секторов: сбережения домохозяйств", importance: low,
          series: [SAVING_EA], previous: { series: SAVING_EA, code: level, name: "норма сбережений" } }
      - { match: "Second release sector accounts (households)", name: "Счета секторов (уточнение)", importance: low, series: [SAVING_EA] }
      - { match: "Quarterly government debt", name: "Госдолг стран ЕС (квартал)", importance: low,
          series: [DE_DEBT_GDP, FR_DEBT_GDP, ES_DEBT_GDP, IT_DEBT_GDP, EA_DEBT_GDP], previous: { series: DE_DEBT_GDP, code: level, name: "долг DE" } }
      - { match: "Quarterly government deficit", name: "Дефицит бюджетов стран ЕС (квартал)", importance: low,
          series: [IT_DEFICIT_GDP, FR_DEFICIT_GDP, ES_DEFICIT_GDP, EA_DEFICIT_GDP, EA_INTEREST_GDP], previous: { series: IT_DEFICIT_GDP, code: level, name: "баланс IT" } }
  - name: ecb_statscal
    horizon_days: 120   # квартальные релизы (стоимость труда, ULC, BLS) — дальше общего горизонта; нужно для флага stale
    kind: ecb_statscal
    url: "https://www.ecb.europa.eu/press/calendars/statscal/html/index.en.html"
    agent: eu_monetary
    timezone: "Europe/Berlin"
    time: "10:00"   # время берётся со страницы; это — если не указано
    events:
      - { match: "Monetary developments in the euro area", dataset: BSI, name: "Денежные агрегаты еврозоны (M3, ЕЦБ)", importance: medium,
          series: [M3_YOY, LOANS_NFC_YOY, LOANS_HH_YOY], previous: { series: M3_YOY, code: level, name: "M3 г/г" } }
      # батч 11f: заголовки и наборы — из статкалендаря ЕЦБ (testdata/relcal/ecb_statscal.html)
      - { match: "Euro area bank interest rate statistics", dataset: MIR, name: "Ставки по кредитам (ЕЦБ)", importance: low,
          series: [MIR_NFC, MIR_HOUSE], previous: { series: MIR_NFC, code: level, name: "кредит бизнесу" } }
      - { match: "Euro area Bank Lending Survey", dataset: BLS, name: "Опрос банков (BLS)", importance: medium,
          series: [BLS_NFC_STD, BLS_NFC_DEM, BLS_HH_STD, BLS_HH_DEM], previous: { series: BLS_NFC_STD, code: level, name: "стандарты, бизнес" } }
      - { match: "Euro Area Indicator of Negotiated Wage Rates", dataset: INW, name: "Переговорные зарплаты (ЕЦБ)", importance: medium,
          series: [NEG_WAGES], previous: { series: NEG_WAGES, code: level, name: "зарплаты г/г" } }
      - { match: "ECB Wage Tracker", dataset: EWT, name: "Wage tracker ЕЦБ", importance: medium,
          series: [WAGE_TRACKER], previous: { series: WAGE_TRACKER, code: level, name: "трекер г/г" } }
      - { match: "TARGET balances statistics", dataset: TGB, name: "Сальдо TARGET", importance: low,
          series: [TARGET_IT, TARGET_DE], previous: { series: TARGET_IT, code: level, name: "TARGET IT" } }
  - name: zew
    kind: dates
    agent: eu_monetary
    timezone: "Europe/Berlin"
    time: "11:05"
    events:
      - { name: "ZEW (Германия)", importance: high, series: [ZEW_SENTIMENT, ZEW_SITUATION],
          previous: { series: ZEW_SENTIMENT, code: level, name: "ZEW Sentiment" },
          dates: [2026-11-17, 2026-12-15, 2027-01-19, 2027-02-16, 2027-03-16, 2027-04-13, 2027-05-11, 2027-06-15,
                  2027-07-20, 2027-08-17, 2027-09-14, 2027-10-19, 2027-11-16, 2027-12-14, 2028-01-18] }
  - name: ec_survey
    kind: dates
    agent: eu_monetary
    timezone: "Europe/Brussels"
    time: "11:00"
    events:
      - { name: "Опрос Еврокомиссии (ESI, confidence)", importance: medium, series: [EC_ICI_DE, EC_ESI_DE, EC_ESI_EA, EC_CONS_EA, EC_SERV_EA, EC_PRICE_EXP],
          previous: { series: EC_ICI_DE, code: level, name: "DE industrial confidence" },
          dates: [2026-11-27, 2027-01-07] }   # [[FILL: даты 2027 — PDF «Publication dates 2027» DG ECFIN]]
      - { name: "Флеш потребительского доверия еврозоны (ЕК)", importance: low, time: "16:00",
          dates: [2026-11-20, 2026-12-21] }
  # SPF ЕЦБ: дата — со страницы SPF ЕЦБ («next release … 5 February 2027 (provisional)», 2026-11-12); время ЕЦБ не публикует,
  # 10:00 CET — со слов пользователя (12.11). Даты 2027 после февраля ЕЦБ ещё не объявил — дописывать по мере публикации.
  - name: ecb_spf
    kind: dates
    agent: eu_monetary
    timezone: "Europe/Berlin"
    time: "10:00"
    events:
      - { name: "SPF ЕЦБ (опрос прогнозистов)", importance: medium, series: [SPF_NEXT_YEAR, SPF_LT],
          previous: { series: SPF_NEXT_YEAR, code: level, name: "SPF на следующий год" },
          dates: [2027-02-05] }

cftc:
  enabled: true
  # TFF — Futures Only (Socrata), как у США; Euro FX — в markets_eu.md мастера (D25: «CFTC Euro FX — в EU Master»).
  # В общем конфиге с США у контракта один agent: eu_master — у мастера Европы, usa_news — в sentiment США.
  endpoint: "https://publicreporting.cftc.gov/resource/gpe5-46if.json"
  check_cron: "0 22 * * 1-5"          # Europe/Bratislava; публикация пт 15:30 ET
  contracts:
    - { name: "Euro FX", code: "099741", agent: eu_master }

treasury:   # датасетов нет; адреса обязательны для проверки конфига
  fiscal_data_url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service"
  release_calendar_url: "https://api.fiscaldata.treasury.gov/services/calendar/release"
  treasurydirect_url: "https://www.treasurydirect.gov/TA_WS/securities"
  datasets: []
  quarterly_refunding_url: "https://home.treasury.gov/policy-issues/financing-the-government/quarterly-refunding"

fed_texts:
  # FOMC statements, minutes, SEP, речи и testimony членов Board, Beige Book.
  # Только federalreserve.gov: speeches.xml содержит речи Board (все 7 — голосующие в 2026);
  # региональные ФРБ не подключаем (решение 2026-10-24). LOOKUP 2026-10-24.
  base_url: "https://www.federalreserve.gov"
  feeds:
    - { name: press_monetary, url: "https://www.federalreserve.gov/feeds/press_monetary.xml" }   # statement, minutes, SEP
    - { name: speeches,       url: "https://www.federalreserve.gov/feeds/speeches.xml" }
    - { name: testimony,      url: "https://www.federalreserve.gov/feeds/testimony.xml" }
  fomc_calendar: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  beige_book: "https://www.federalreserve.gov/monetarypolicy/publications/beige-book-default.htm"
  poll_interval: 15m          # RSS: речи, testimony и прочее вне календаря
  agent: eu_monetary

ecb_texts:
  # Тексты ЕЦБ (ТЗ §6.1): решения, monetary policy statement (вступление) и Q&A пресс-конференции,
  # accounts, речи и интервью членов Исполнительного совета; календарь заседаний и режим дня решения (§8.2).
  # LOOKUP 2026-11-11 (живые запросы). Адрес страницы содержит непредсказуемый хеш (ecb.mp261029~9a493adf17),
  # поэтому в день решения опрашиваются RSS и годовые списки, а не страница.
  enabled: true
  base_url: "https://www.ecb.europa.eu"
  rss: "https://www.ecb.europa.eu/rss/press.html"           # 15 последних: речи, интервью, решения, заявления
  lists:                                                     # годовые списки; {year} подставляется
    decisions:  "/press/govcdec/mopo/{year}/html/index_include.en.html"
    statements: "/press/press_conference/monetary-policy-statement/{year}/html/index_include.en.html"
    accounts:   "/press/accounts/{year}/html/index_include.en.html"
  meeting_calendar: "https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html"
  timezone: "Europe/Berlin"
  times:                     # время публикации, если документ найден в списке, а не в RSS
    decision: "14:15"
    press_conference: "14:45"
    accounts: "13:30"
  poll_interval: 15m         # RSS, списки и перечитывание заявлений ради Q&A
  agent: eu_monetary
  check_series: ECB_DFR      # сверка распознанной ставки с рядом после вступления решения в силу
  day_mode:
    lead: 1m                 # начать опрос за минуту до 14:15
    rss_interval: 20s
    list_interval: 60s       # годовые списки (35–43 КБ) — подстраховка, если RSS отстаёт
    fast_for: 75m            # частый опрос до 15:30, дальше — стандартные шаги §8.2
    alert_decision_at: "14:25"   # нет решения — тревога в Telegram
    statement_wait: "15:30"      # нет заявления — экспорт с одним решением; нет ничего — тревога

calendar:
  # releases обновляется раз в сутки на horizon_days вперёд (ТЗ §8.1)
  horizon_days: 14
  refresh_cron: "0 5 * * *"   # Europe/Bratislava
  # FRED release/dates отдаёт только дату; время выхода — по release_id (LOOKUP 2026-10-24,
  # официальные календари BLS/BEA/ФРС/NY Fed/DOL/UMich). Нет в списке — default_release_time.
  release_timezone: "America/New_York"
  default_release_time: "08:30"
  release_times:
    10: "08:30"    # CPI (BLS)
    11: "08:30"    # Employment Cost Index (BLS)
    17: "16:15"    # H.10, понедельник (ФРС)
    18: "16:15"    # H.15 (ФРС)
    20: "16:30"    # H.4.1, четверг (ФРС)
    21: "13:00"    # H.6, 4-й вторник (ФРС)
    46: "08:30"    # PPI (BLS)
    47: "08:30"    # Productivity and Costs (BLS)
    50: "08:30"    # Employment Situation (BLS)
    53: "08:30"    # GDP (BEA)
    54: "08:30"    # Personal Income and Outlays (BEA)
    91: "10:00"    # Surveys of Consumers (UMich)
    180: "08:30"   # UI Weekly Claims, четверг (DOL)
    192: "10:00"   # JOLTS (BLS)
    263: "08:30"   # Debt to GDP (вместе с GDP)
    304: "16:15"   # Interest Rate Spreads (из H.15)
    313: "08:30"   # Sticky Price CPI (в день CPI)
    379: "13:15"   # Temporary OMO / RRP (окно операции 12:45–13:15)
    445: "08:00"   # SOFR (NY Fed)
  # важность релизов FRED для calendar_usa.md — по ★ в DATA_MAP; нет в списке — low
  release_importance:
    10: high       # CPI ★
    11: medium     # Employment Cost Index ★
    20: medium     # H.4.1: WALCL, TGA, резервы ★
    46: high       # PPI ★
    50: high       # Employment Situation: NFP, безработица ★
    53: high       # GDP ★
    54: high       # Personal Income and Outlays: PCE ★
    91: high       # UMich ★
    180: high      # Initial / Continued Claims ★
    192: high      # JOLTS ★
    363: medium    # Monthly Treasury Statement: дефицит ★
    386: medium    # GDPNow ★

# Посты Telegram и RSS — те же источники, что в пресете США: файл новостей общий для регионов
# (решение пользователя 2026-11-10). В конфиге США+Европа эти секции одни на оба региона; region у канала —
# любой из регионов (общий файл читает посты всех).
posts:
  poll_interval: 15m
  history_days: 30          # история при первом опросе нового источника (переопределяется в строке источника)

telegram:
  enabled: false            # включите и добавьте свои каналы в channels
  mode: web                 # публичные каналы через t.me/s/<handle> (D12); mtproto не реализован
  base_url: "https://t.me"
  channels:
    # handle — имя из ссылки t.me/<handle>; region: usa | eu ; type: news | opinion
    # default_tag: "" | usa_monetary | usa_fiscal | usa_micro | usa_politics | energy_geopolitics | eu_ecb | eu_fiscal | eu_macro | eu_micro
    # history_days: необязательно, по умолчанию posts.history_days
    # - { handle: your_channel, region: usa, type: news, default_tag: "", profile: "short description of the channel for the classifier" }
    []

rss_feeds: []
  # name — латиница/цифры/_ (источник в БД: rss:<name>); остальные поля — как у каналов
  # формат: - { name: <имя>, url: "<лента>", region: usa, type: opinion, default_tag: "", profile: "<кто автор>" }
  # macro_letter убран 2026-11-06 (решение пользователя): лента пуста с 2026-07-13, ноль статей за всё время.
  # Substack иногда отвечает 403 с заглушкой Cloudflare («Just a moment…») — источник попадает в sources_failed.

# =====================================================================
# КОМПАНИИ
# =====================================================================

classify:
  # Запасной путь (если Gemini недоступен). Регистр не важен; «слово*» — любое окончание
  # (ставк* → ставка, ставки, ставку); фраза совпадает, если слова идут подряд.
  # Укр./рус. слова утверждены пользователем 2026-10-25.
  min_score: 2
  # Теги постов; тот же набор — в rules и в prompts/classify.md. Порядок разрешает ничьи.
  tags: [usa_monetary, usa_fiscal, usa_micro, usa_politics, energy_geopolitics, eu_ecb, eu_fiscal, eu_macro, eu_micro]
  rules:
    usa_monetary: ["FOMC","Fed","Warsh","Powell","fed funds","rate cut","rate hike","dot plot","CPI","PCE","PPI","payrolls","NFP","jobless claims","unemployment","inflation","QT",
                   "ФРС","Ворш*","Пауелл*","Пауэлл*","ставк* ФРС","зниження ставки","снижени* ставки","підвищення ставки","повышени* ставки",
                   "інфляц*","инфляц*","безробітт*","безработиц*","зайнятіст*","занятост*","заявки на допомогу","заявки на пособи*",
                   "ВВП США","роздрібн* продаж*","розничн* продаж*","споживч* настр*","потребительск* настро*"]
    usa_fiscal:   ["Treasury","TGA","auction","refunding","deficit","debt ceiling","Bessent","bills","coupons","term premium","RRP","reserves","SOFR","repo",
                   "Мінфін* США","Минфин* США","казначейств*","Бессент*","аукціон*","аукцион*","дефіцит*","дефицит*","держборг*","госдолг*",
                   "борг* США","долг* США","облігаці*","облигаци*","трежеріс","трежерис","дохідніст*","доходност*","ліквідніст*","ликвидност*","репо","шатдаун*"]
    usa_micro:    ["earnings","guidance","revenue","EPS","capex","NVDA","Nvidia","MSFT","Microsoft","AAPL","Apple","AMZN","Amazon","META","GOOGL","Alphabet","AVGO","Broadcom","TSLA","Tesla",
                   "звітніст*","отчетност*","виручк*","выручк*","прибут*","прибыл*","гайденс*","капекс","Mag7","напівпровідник*","полупроводник*","OpenAI"]
    usa_politics: ["election*","Congress*","midterm*","White House","Trump*","Hassett*","shutdown*","tariff*",
                   "вибор*","выбор*","конгрес*","біл* дім","біл* дом*","бел* дом*","Трамп*","Хассет*","мідтерм*","тариф*","мита","мито","митами","пошлин*"]
    energy_geopolitics: ["oil","Brent","WTI","OPEC*","Iran*","Israel*","Russia*","sanction*",
                   "нафт*","нефт*","ОПЕК*","Іран*","Иран*","Ізраїл*","Израил*","Росі*","Росси*","санкц*"]
    eu_ecb:       ["ECB","Lagarde","deposit rate","HICP","eurozone inflation","ЕЦБ","ЄЦБ","Лагард*","депозитн* ставк*","єврозон* інфляц*","еврозон* инфляц*"]
    eu_fiscal:    ["Bund","BTP","OAT","spread","Schuldenbremse","debt brake","German budget","defense spending",
                   "Бунд*","бюджет* Франці*","бюджет* Франци*","Італі*","Итали*","кредитн* рейтинг*","боргов* гальм*","долгов* тормоз*","оборонн* витрат*","оборонн* расход*"]
    eu_macro:     ["Ifo","ZEW","PMI","Destatis","German industry","TTF","China",
                   "Німеччин*","Германи*","єврозон*","еврозон*","EUR/USD","Brent","Китай*"]
    eu_micro:     ["SAP","Siemens","Allianz","Deutsche Telekom","Airbus","Mercedes","DAX","Stoxx"]
  drop_if_contains: ["розыгрыш","промокод","реклама","подписывайтесь","скидка","розіграш","підпишись","підписуйтесь","знижк*"]
  # Основной классификатор (D14). Ключ — только env GEMINI_API_KEY. Без ключа, при ошибке,
  # квоте или невалидном ответе пакет размечается ключевыми словами (rules выше).
  gemini:
    enabled: false   # включите вместе с telegram; ключ — GEMINI_API_KEY
    endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    model: gemini-3.5-flash-lite      # LOOKUP M2, подтверждено 2026-10-25
    prompt: "prompts/classify.md"     # путь от папки config.yaml; правится без пересборки
    batch_size: 20
    min_confidence: 0.5
    timeout: 60s
    daily_request_limit: 200          # свой предел в сутки (по Тихоокеанскому времени), ниже квоты AI Studio

# Чистка постов в News (FIXES_W44, батч E). Слова и фразы — как в classify.rules: целые слова без учёта
# регистра, «слово*» — любое окончание.
news:
  min_text_chars: 40          # пост короче (после чистки, без эмодзи) — картинка с подписью, не экспортируется
  signature_share: 0.5        # строка в ≥50% постов канала за неделю — подпись канала, вырезается
  signature_min_posts: 4      # при меньшем числе постов канала подписи не ищутся
  promo_words: ["спільнот*","підписник*","трансляці*","подкаст*","читать бесплатно","join","subscribe*","Market News Bureau"]   # строка с ними вырезается
  opinion_markers: ["я бы","для меня","на мой взгляд","я думаю","базовий сценарій","I think","my view","IMO"]   # пост с ними — «мнение», иначе тип канала
  calendar_posts: ["Основні події на ринках сьогодні","Основні події тижня","Основные события дня","Основные события недели","Главные события дня","Главные события недели"]   # начало анонса календаря — в экспорт не идёт
  global_max: 5               # постов в разделе «Глобально»
  views_refresh: true         # перед недельным экспортом перечитать просмотры (и флаг фото) постов недели с t.me/s
  # Новый экспорт USA News (2026-11-03): посты не обрезаются, шум убирается целиком.
  caption_max_chars: 300      # пост с фото короче (без эмодзи), со словом из drop_keywords.caption и без маркеров мнения — подпись к графику, не экспортируется
  opinions_per_channel: 6     # мнений канала целиком (по резонансу за неделю); остальные — строкой «первая фраза + ссылка» в «Ещё мнения (кратко)»; 0 — все. У канала — свой лимит opinions_full
  drop_keywords:              # пост с этими словами (и без строки «факт (ожидание)») не экспортируется; причина — в счётчике
    announce: ["вже за","уже через","скоро вийде","скоро выйдет","незабаром","stay tuned","coming soon","нагадуємо","напоминаем",
               "пряма трансляці*","прямая трансляци*","дивитись тут","смотреть тут","новий випуск","новый выпуск","свіжий випуск","свежий выпуск"]
    caption:  ["у додаток до теми","в дополнение к теме","ліворуч","праворуч","слева","справа","на графіку","на графике","динаміка","динамика","хроніка","хроника","chart",
               "лідирують","лідирує","лидируют","лидирует","найсильніший","слабейший","лузери сесії","лідери сесії","heatmap","теплова карта"]   # только для поста с фото короче caption_max_chars
    product:  ["представила","представив","презентувала","презентовала","релізить","unveil*","iPad","iPhone","MacBook","iMac","GTA"]   # ещё без «%» и только в AI/отчётах/без тега
  topics:                     # темы, которых нет среди тегов классификатора
    ai:     ["AI","ШІ","ИИ","АІ","OpenAI","Anthropic","ChatGPT","Gemini","DeepMind","LLM","Nvidia","NVDA","напівпровідник*","полупроводник*","chip*","чіп*","чип*",
             "дата центр*","датацентр*","data center*","datacenter*","hyperscaler*","гіперскейлер*","гиперскейлер*","AI capex","Mag7", "memory","DRAM","HBM","NAND","памʼяттю","памʼяті","пам'яттю","пам'яті","пам’яттю","пам’яті","памяти","памятью"]   # usa_micro с ними → «AI и техсектор»
    market: ["позиціонуванн*","позиционировани*","positioning","CTA","COT","СоТ","flows","потоки","buyback*","байбек*","VIX","breadth","ширина ринку","ширина рынка",
             "пре-маркет","премаркет","pre-market","premarket","risk on","risk off","small cap*","розкореляці*","ротаці*","rotation","S&P 500","Nasdaq100","Nasdaq 100",
             "Kalshi","Polymarket","prediction market*","BTC","біткоїн*","биткоин*","bitcoin","crypto*","крипто*","stablecoin*","стейбл*","Binance","Coinbase","Tether","USDT"]   # usa_micro или без тега → «Рынок и позиционирование»
    global: ["НБУ","BoJ","Уеда","Японі*","Япони*","Банк Англії","Банк Англии","Bank of England","Британі*","Британи*","Commonwealth","содружеств*","співдружност*"]   # → «Глобально»
  mention_topics_top: 3       # «Растут» — топ-N тем по приросту к прошлой неделе
  mention_topics:             # Обзор → «Темы недели в каналах»: посты USA News недели (после чистки), где есть слово темы; синтаксис как classify.rules
    - { name: "Рецессия",           words: ["recession*", "рецесі*", "рецесс*", "hard landing", "жорстк* посадк*", "жестк* посадк*"] }
    - { name: "Повышение ставки",   words: ["rate hike*", "hike*", "hiking", "підвищен* ставк*", "підвищит* ставк*", "повышен* ставк*", "повысит* ставк*", "повысить ставку"] }
    - { name: "Снижение ставки",    words: ["rate cut*", "cut rates", "cutting rates", "знижен* ставк*", "знизит* ставк*", "снижен* ставк*", "снизит* ставк*", "снизить ставку"] }
    - { name: "AI bubble / AI capex", words: ["ai bubble", "ai capex", "capex", "капекс*", "бульбашк* ші", "бульбашк* ai", "пузыр* ии", "пузыр* ai", "дата центр*", "data center*", "datacenter*"] }
    - { name: "Нефть",              words: ["oil", "нафт*", "нефт*", "brent", "wti", "opec*", "опек*"] }
    - { name: "Тарифы",             words: ["tariff*", "тариф*", "мито", "мита", "митами", "пошлин*"] }
    - { name: "Выборы",             words: ["election*", "midterm*", "вибор*", "выбор*"] }
    - { name: "Шатдаун",            words: ["shutdown*", "шатдаун*"] }
    - { name: "Кредитный стресс",   words: ["credit spread*", "high yield", "junk bond*", "private credit", "default*", "дефолт*", "кредитн* спред*", "кредитн* стрес*", "приватн* кредит*", "частн* кредит*"] }
  surprise_facts:             # «Сюрпризы недели»: факт из нашего ряда FRED, если он вышел за неделю; первое совпадение по подписи показателя. Иначе — факт из поста. label — имя показателя в строке поста-ожидания (+ m/m, y/y)
    - { label: "Core CPI", words: ["core cpi","базов* ІСЦ","базов* ИПЦ"], when: ["yoy","y y","р р","г г"], series: CPILFESL, transform: yoy, unit: "%" }
    - { label: "Core CPI", words: ["core cpi","базов* ІСЦ","базов* ИПЦ"], series: CPILFESL, transform: mom, unit: "%" }
    - { label: "CPI", words: ["cpi","ІСЦ","ИПЦ"], when: ["yoy","y y","р р","г г"], series: CPIAUCSL, transform: yoy, unit: "%" }
    - { label: "CPI", words: ["cpi","ІСЦ","ИПЦ"], series: CPIAUCSL, transform: mom, unit: "%" }
    - { label: "PPI", words: ["ppi","ррі","ІЦВ"], unless: ["core"], when: ["yoy","y y","р р","г г"], series: PPIFIS, transform: yoy, unit: "%" }
    - { label: "PPI", words: ["ppi","ррі","ІЦВ"], unless: ["core"], series: PPIFIS, transform: mom, unit: "%" }
    - { label: "Core PCE", words: ["core pce"], when: ["yoy","y y","р р","г г"], series: PCEPILFE, transform: yoy, unit: "%" }
    - { label: "Core PCE", words: ["core pce"], series: PCEPILFE, transform: mom, unit: "%" }
    - { label: "PCE", words: ["pce"], when: ["yoy","y y","р р","г г"], series: PCEPI, transform: yoy, unit: "%" }
    - { label: "Nonfarm Payrolls", words: ["nonfarm payrolls","nfp","non farm payrolls"], unless: ["private"], series: PAYEMS, transform: diff, unit: "K" }
    - { label: "Unemployment Rate", words: ["unemployment rate","рівень безробіття","уровень безработицы"], series: UNRATE, transform: level, unit: "%" }
    - { label: "Initial Claims", words: ["ijc","initial jobless","jobless claims","initial claims"], series: ICSA, transform: level, scale: 0.001, unit: "K" }
    - { label: "GDP", words: ["gdp","ВВП"], unless: ["gdpnow"], series: GDPC1, transform: qoqa, unit: "%" }
    - { label: "JOLTS", words: ["jolts"], series: JTSJOL, transform: level, scale: 0.001, unit: "M" }

