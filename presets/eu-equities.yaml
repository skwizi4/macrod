# Пресет eu-equities: Европа (ТЗ §6.1, фаза 11). ЧЕРНОВИК: растёт по батчам 11b–11e.
# Сейчас — числовые источники (11b) и один файл со всеми рядами для проверки; агенты, отчёты,
# тексты ЕЦБ, компании и дашборд добавляются в 11c–11e.
# Источники: ECB Data Portal, Bundesbank, Eurostat, STOXX, ZEW (без ключей), Yahoo, FRED (нужен FRED_API_KEY).
timezone: "Europe/Bratislava"
data_dir: "./data"
db_path: "${data_dir}/macro.db"
history_start: "2000-01-01"

export:
  exchange_dir: "${data_dir}/exchange"
  reports_dir: "${data_dir}/reports"
  # prompts_dir: "prompts" # промпты агентов <регион>/<агент>.md → instructions.md в папке агента (ТЗ §21.5);
  #   относительный путь — от папки этого файла: при ./data/config.yaml искать будет ./data/prompts
  weekly_cron: "0 16 * * 0"          # воскресенье 16:00 Europe/Bratislava
  lookback_days: 7
  max_file_chars: 60000
  event_export: immediate             # FOMC/ЕЦБ — экспорт сразу после появления документа

regions:
  - id: eu
    title: "Европа"         # в сообщении доставки
    index: "^GDAXI"
    yahoo_poll: "18:00"     # Europe/Bratislava, после закрытия Xetra (ТЗ §8.3)
    timezone: "Europe/Berlin"   # своя зона региона: вторая колонка времени calendar_eu.md, дни релизов (ТЗ §17.8)
    timezone_label: "CET/CEST"
    agents:
      - id: monetary_macro
        folder: monetary_macro
        series_tags: [eu_monetary]
        texts: [ecb_texts]
        reports:
          # тот же вид отчёта, что USA Monetary; шаблон Европы — без траектории ZQ и текстов ФРС (они у агента,
          # который читает тексты fed), с текстами ЕЦБ. fed — ставки, баланс и ликвидность ЕЦБ; credit (необязательная
          # таблица, батч 11f) — деньги, кредит, ставки по кредитам, BLS; energy — котировки Yahoo, в том числе валюты.
          - report: monetary
            file: current_week.md
            title: "EU Monetary & Macro"
            template: monetary_eu
            tables:
              growth: [GDP_EA, GDP_EA_NOM, GDP_EA_DEFL, CONS_EA, NETEXP_EA, SAVING_EA, GDP_DE, GDP_FR, GDP_IT, GDP_ES,
                       IP_EA, RETAIL_EA, DE_ORDERS, DE_PRODUCTION]
              sentiment: [EC_ESI_EA, EC_CONS_EA, EC_SERV_EA, EC_ICI_DE, EC_ESI_DE, ZEW_SENTIMENT, ZEW_SITUATION, IFO_CLIMATE, IFO_EXPECTATIONS]
              labor: [UNEMP_EA, UNEMP_DE, UNEMP_FR, UNEMP_IT, UNEMP_ES, EMPL_EA, JOBVAC_EA, NEG_WAGES, WAGE_TRACKER, LCI_EA, ULC_EA, PROD_EA]
              inflation: [HICP, HICP_CORE, HICP_SA, HICP_CORE_SA, HICP_SERV, HICP_NEIG, HICP_ENERGY, HICP_FOOD,
                          HICP_DE, HICP_FR, HICP_IT, HICP_ES, PPI_EA, PPI_EA_CORE]
              expectations: [CES_1Y, CES_3Y, SPF_NEXT_YEAR, SPF_LT, EC_PRICE_EXP]
              fed: [ECB_DFR, ESTR, ESTR_DFR, ECB_ASSETS, EXCESS_LIQ, ILM_GOV_DEP]
              credit: [M3_YOY, LOANS_NFC_YOY, LOANS_HH_YOY, MIR_NFC, MIR_HOUSE, BLS_NFC_STD, BLS_NFC_DEM, BLS_HH_STD, BLS_HH_DEM]
              energy: ["TTF=F", "BZ=F", "EURUSD=X", "CNY=X"]
          # лимит размера выше общего (60 000): заявление и Q&A ЕЦБ длиннее, чем у ФРС; тексты не режутся, превышение — предупреждение в логе
          - { report: ecb_diff, file: ecb_diff.md, title: "EU Monetary & Macro", max_chars: 100000 }
      - id: fiscal_bonds
        folder: fiscal_bonds
        series_tags: [eu_fiscal]
        reports:
          # государственные облигации: кривая Bund, спреды (MTS, derived), месячные 10Y ЕЦБ, долг и дефицит,
          # аукционы Bund (секция finanzagentur с agent: eu_fiscal) — недели и следующей недели
          - report: fiscal_bonds
            file: current_week.md
            title: "EU Fiscal & Bonds"
            tables:
              curve: [BUND_2Y, BUND_5Y, BUND_10Y, BUND_30Y, BUND_2S10S, ECB_YC_AAA_10Y, ECB_YC_ALL_10Y]
              spreads: [BTP_BUND, OAT_BUND, UST_BUND, ECB_ALL_AAA_10Y, "MIT10.AS", "MFR10.AS", "MDE10.AS"]
              monthly: [IRS_IT_10Y, IRS_FR_10Y, IRS_ES_10Y, IRS_DE_10Y]
              debt: [EA_DEBT_GDP, DE_DEBT_GDP, FR_DEBT_GDP, IT_DEBT_GDP, ES_DEBT_GDP, EA_DEFICIT_GDP, FR_DEFICIT_GDP, IT_DEFICIT_GDP, ES_DEFICIT_GDP,
                     EA_INTEREST_GDP, TARGET_IT, TARGET_DE]
      - id: micro
        series_tags: [eu_micro]
        companies: [SAP, SIE, ALV, AIR, DTE, ENR, RHM, MBG]
        reports:
          # EU Micro (ТЗ §18.7): цены и реакция на отчёт по всем восьми, даты отчётов из секции issuers,
          # годовые цифры SAP (EDGAR 20-F) и Airbus (ESEF), пресс-релизы — абзацы outlook и цитаты.
          - { report: micro_annual, file: current_week.md, title: "EU Micro" }
      - id: news
        series_tags: [eu_news]
        reports:
          # Файл новостей общий с USA News (решение пользователя 2026-11-10): тот же блок отчёта, что в пресете
          # США, — тело файлов одинаково, отличаются шапка и заголовок. sentiment.md — свой, по европейским активам.
          - report: news
            file: current_week.md
            title: "EU News"
            filtered_file: news_filtered.md
            uncategorized_file: uncategorized.md
            shared: true
            own_tag_prefixes: ["usa_", "eu_"]
            tag_topics: { usa_monetary: fed, usa_fiscal: fiscal, usa_politics: politics, energy_geopolitics: energy, usa_micro: earnings,
                          eu_ecb: europe, eu_fiscal: europe, eu_macro: europe, eu_micro: europe }
          - report: sentiment
            file: sentiment.md
            title: "EU Sentiment"
            template: sentiment_eu
            # Свой блок вместо верхнего sentiment (ТЗ §12.6, «Европа»). Put/call и ширины рынка по Европе бесплатных
            # нет; COT Euro FX — в markets_eu.md мастера (секция cftc, agent: eu_master).
            sentiment:
              sections: [reaction, moves, regime, volatility]
              corr_days: 20
              regime_threshold: 0.3
              regime: { equity: "^GDAXI", rates: BUND_10Y }     # r(GER40, Δ Bund 10Y)
              volatility: [VDAX_NEW, VSTOXX]
              vol_ratio: { num: VDAX_NEW, den: "^VIX", label: "VDAX/VIX", inversion: false }
              put_call: false
              reaction:
                symbols:
                  - { symbol: "^GDAXI",   label: "GER40" }
                  - { series: BUND_10Y,   label: "Bund 10Y б.п." }   # минутных баров нет: Δ за день (Бундесбанк), решение 2026-11-11
                  - { symbol: "EURUSD=X", label: "EUR/USD" }
                window: 30m
                close: "17:30"               # Xetra; событие после 17:30 — до закрытия следующего дня
                timezone: "Europe/Berlin"
                keep_days: 60
                fetch_delay: 20m
                check_every: 30m
                earnings: true               # отчёты компаний EU Micro (даты из конфига)
                events:
                  - { name: "Флеш HICP еврозоны",  label: "HICP флеш", aliases: ["HICP", "інфляці* єврозон*", "инфляци* еврозон*"] }
                  - { name: "Флеш ВВП еврозоны",   label: "ВВП EZ флеш", aliases: ["GDP", "ВВП єврозон*", "ВВП еврозон*"] }
                  - { name: "ZEW (Германия)",       label: "ZEW",       aliases: ["ZEW"] }
                  - { name: "Опрос Еврокомиссии (ESI, confidence)", label: "ЕК опрос", aliases: ["ESI", "economic sentiment"] }
                  - { name: "ECB decision",         label: "ЕЦБ",       aliases: ["ECB", "ЄЦБ", "ЕЦБ", "deposit rate"] }
                  # события США двигают GER40 и EUR/USD (решение пользователя 2026-11-11); есть в календаре, только если в конфиге регион usa
                  - { name: "Consumer Price Index", label: "US CPI",  aliases: ["CPI", "ІСЦ", "ИПЦ"], region: usa }
                  - { name: "Employment Situation", label: "US NFP",  aliases: ["NFP", "Nonfarm", "Payrolls"], region: usa }
                  - { name: "FOMC decision",        label: "FOMC",    aliases: ["FOMC", "Fed Funds"], region: usa }
              daily_moves:
                - { symbol: "^GDAXI",   label: "GER40" }
                - { series: BUND_10Y,   label: "Bund 10Y б.п." }
                - { symbol: "EURUSD=X", label: "EUR/USD" }
                - { symbol: "TTF=F",    label: "TTF" }
      - id: master
        series_tags: [eu_master]
        reports:
          - report: markets
            file: markets_eu.md
            title: "EU Markets"
            tables:
              rows: [ECB_DFR, ESTR, ECB_ASSETS, HICP, HICP_CORE, HICP_SA, HICP_CORE_SA, HICP_DE,
                     ECB_YC_AAA_10Y, ECB_YC_ALL_10Y, IRS_IT_10Y, IRS_FR_10Y, IRS_DE_10Y,
                     BUND_2Y, BUND_10Y, BUND_30Y, DE_ORDERS, DE_PRODUCTION,
                     GDP_EA, GDP_DE, DE_DEBT_GDP, IT_DEFICIT_GDP, EC_ICI_DE, EC_ESI_DE,
                     VDAX_NEW, VSTOXX, ZEW_SENTIMENT, ZEW_SITUATION,
                     "^GDAXI", "^STOXX50E", "EURUSD=X", "CNY=X", "BZ=F", "TTF=F", "MIT10.AS", "MFR10.AS", "MDE10.AS",
                     BTP_BUND, OAT_BUND, UST_BUND, BUND_2S10S, ECB_ALL_AAA_10Y, GER40_NDX,
                     IFO_CLIMATE, IFO_EXPECTATIONS,
                     UNEMP_EA, M3_YOY, CES_1Y, SPF_LT, BUND_5Y, CISS, EUR_NEER, EURGBP, EURJPY]
          - { report: calendar, file: calendar_eu.md, title: "EU Calendar" }
          # 12 строк ТЗ §12.7; строк сентимента США (sentiment_rows) нет
          - report: key_metrics
            file: key_metrics_eu.md
            title: "EU Key Metrics"
            rows:
              - { label: "Deposit Rate (ЕЦБ)", id: ECB_DFR }
              - { label: "HICP core 3mA", id: HICP_CORE_SA, code: a3m }
              - { label: "Bund 10Y", id: BUND_10Y }
              - { label: "BTP-Bund 10Y", id: BTP_BUND }
              - { label: "UST-Bund 10Y", id: UST_BUND }
              - { label: "DE industrial confidence (EC)", id: EC_ICI_DE }
              - { label: "ZEW Economic Sentiment", id: ZEW_SENTIMENT }
              - { label: "TTF", id: "TTF=F" }
              - { label: "EUR/USD", id: "EURUSD=X" }
              - { label: "VDAX-NEW (STOXX)", id: VDAX_NEW }
              - { label: "GER40", id: "^GDAXI" }
              - { label: "GER40/NDX", id: GER40_NDX }
    # Страницы дашборда Европы (ТЗ §21.4), порядок = порядок меню; как у США. Виды capex, financials, reactions,
    # fed_path, auctions, supply читают отчёты США (micro, monetary с ZQ, fiscal_liquidity) — у Европы их нет.
    dashboard:
      pages:
        - id: overview
          title: "Обзор"
          views: [{ view: key_metrics }, { view: status }]
        - id: ecb
          title: "ЕЦБ и инфляция"
          charts:
            - { title: "Ставки ЕЦБ", kind: line, series: [{ ref: ecb/ECB_DFR }, { ref: ecb/ESTR }] }
            - title: "HICP, YoY"
              kind: line
              series:
                - { ref: ecb/HICP, transform: yoy, label: "HICP" }
                - { ref: ecb/HICP_CORE, transform: yoy, label: "HICP core" }
                - { ref: ecb/HICP_DE, transform: yoy, label: "HICP Германия" }
            - { title: "HICP core, 3 мес. в годовом выражении", kind: line, series: [{ ref: ecb/HICP_CORE_SA, transform: a3m, label: "HICP core 3mA" }] }
            - { title: "Баланс Евросистемы", kind: line, series: [{ ref: ecb/ECB_ASSETS }] }
            - title: "HICP по компонентам, YoY"
              kind: line
              series:
                - { ref: ecb/HICP_SERV, transform: yoy, label: "Услуги" }
                - { ref: ecb/HICP_NEIG, transform: yoy, label: "Промтовары" }
                - { ref: ecb/HICP_ENERGY, transform: yoy, label: "Энергия" }
                - { ref: ecb/HICP_FOOD, transform: yoy, label: "Еда" }
            - title: "HICP по странам, YoY"
              kind: line
              series:
                - { ref: ecb/HICP_DE, transform: yoy, label: "Германия" }
                - { ref: ecb/HICP_FR, transform: yoy, label: "Франция" }
                - { ref: ecb/HICP_IT, transform: yoy, label: "Италия" }
                - { ref: ecb/HICP_ES, transform: yoy, label: "Испания" }
            - title: "Инфляционные ожидания"
              kind: line
              series: [{ ref: ecb/CES_1Y, label: "Потребители, 12 мес." }, { ref: ecb/CES_3Y, label: "Потребители, 3 года" },
                       { ref: ecb/SPF_NEXT_YEAR, label: "SPF, следующий год" }, { ref: ecb/SPF_LT, label: "SPF, долгосрок" }]
            - { title: "PPI еврозоны, YoY", kind: line, series: [{ ref: eurostat/PPI_EA, transform: yoy, label: "PPI" }, { ref: eurostat/PPI_EA_CORE, transform: yoy, label: "PPI без энергии" }] }
            - { title: "Избыточная ликвидность (≈)", kind: line, series: [{ ref: derived/EXCESS_LIQ }] }
            - { title: "€STR − ставка по депозитам", kind: line, series: [{ ref: derived/ESTR_DFR }] }
        - id: bonds
          title: "Облигации"
          charts:
            - title: "Кривая Bund: сейчас и 4 недели назад"
              kind: curve
              compare_days: 28
              series:
                - { ref: bundesbank/BUND_2Y, label: "2Y" }
                - { ref: bundesbank/BUND_5Y, label: "5Y" }
                - { ref: bundesbank/BUND_10Y, label: "10Y" }
                - { ref: bundesbank/BUND_30Y, label: "30Y" }
            - { title: "Спреды к Bund 10Y", kind: line, series: [{ ref: derived/BTP_BUND }, { ref: derived/OAT_BUND }, { ref: derived/UST_BUND }] }
            - { title: "Bund 2s10s", kind: line, series: [{ ref: derived/BUND_2S10S }] }
            - { title: "Кривые ЕЦБ 10Y: AAA и все эмитенты", kind: line, series: [{ ref: ecb/ECB_YC_AAA_10Y }, { ref: ecb/ECB_YC_ALL_10Y }] }
            - title: "Госдолг, % ВВП"
              kind: line
              series: [{ ref: eurostat/EA_DEBT_GDP, label: "Еврозона" }, { ref: eurostat/DE_DEBT_GDP, label: "Германия" }, { ref: eurostat/FR_DEBT_GDP, label: "Франция" },
                       { ref: eurostat/IT_DEBT_GDP, label: "Италия" }, { ref: eurostat/ES_DEBT_GDP, label: "Испания" }]
            - { title: "TARGET: Италия и Германия", kind: line, series: [{ ref: ecb/TARGET_IT, label: "Италия" }, { ref: ecb/TARGET_DE, label: "Германия" }] }
        - id: economy
          title: "Экономика"
          charts:
            - { title: "ZEW", kind: line, series: [{ ref: zew/ZEW_SENTIMENT }, { ref: zew/ZEW_SITUATION }] }
            # баланс (около нуля) и индекс (около 100) — на разных графиках: на одной оси баланс выглядит плоским
            - { title: "Промышленное доверие DE (ЕК), баланс", kind: line, series: [{ ref: eurostat/EC_ICI_DE }] }
            - { title: "Экономические настроения DE (ЕК, ESI), индекс", kind: line, series: [{ ref: eurostat/EC_ESI_DE }] }
            - title: "Заказы и промпроизводство DE, YoY"
              kind: line
              series:
                - { ref: bundesbank/DE_ORDERS, transform: yoy, label: "Заказы" }
                - { ref: bundesbank/DE_PRODUCTION, transform: yoy, label: "Промпроизводство" }
            - title: "Реальный ВВП, YoY"
              kind: bar
              series: [{ ref: eurostat/GDP_EA, transform: yoy, label: "Еврозона" }, { ref: eurostat/GDP_DE, transform: yoy, label: "Германия" },
                       { ref: eurostat/GDP_FR, transform: yoy, label: "Франция" }, { ref: eurostat/GDP_IT, transform: yoy, label: "Италия" }, { ref: eurostat/GDP_ES, transform: yoy, label: "Испания" }]
            - { title: "Промпроизводство и розница еврозоны, YoY", kind: line, series: [{ ref: eurostat/IP_EA, transform: yoy, label: "Промпроизводство" }, { ref: eurostat/RETAIL_EA, transform: yoy, label: "Розница" }] }
            - { title: "Настроения еврозоны (ЕК)", kind: line, series: [{ ref: eurostat/EC_CONS_EA, label: "Потребители" }, { ref: eurostat/EC_SERV_EA, label: "Услуги" }] }
            - { title: "ESI еврозоны (ЕК), индекс", kind: line, series: [{ ref: eurostat/EC_ESI_EA }] }
        - id: labor
          title: "Рынок труда"
          charts:
            - title: "Безработица"
              kind: line
              series: [{ ref: eurostat/UNEMP_EA, label: "Еврозона" }, { ref: eurostat/UNEMP_DE, label: "Германия" }, { ref: eurostat/UNEMP_FR, label: "Франция" },
                       { ref: eurostat/UNEMP_IT, label: "Италия" }, { ref: eurostat/UNEMP_ES, label: "Испания" }]
            - { title: "Занятость еврозоны", kind: line, series: [{ ref: eurostat/EMPL_EA }] }
            - title: "Зарплаты и стоимость труда, YoY"
              kind: line
              series: [{ ref: ecb/NEG_WAGES, label: "Переговорные зарплаты" }, { ref: eurostat/LCI_EA, transform: yoy, label: "Индекс стоимости труда" },
                       { ref: eurostat/ULC_EA, transform: yoy, label: "Удельные затраты на труд" }]
            - { title: "Доля вакансий", kind: line, series: [{ ref: eurostat/JOBVAC_EA }] }
            - { title: "Wage tracker ЕЦБ: факт", kind: line, series: [{ ref: ecb/WAGE_TRACKER, part: actual, label: "Wage tracker, г/г" }] }
            - { title: "Wage tracker ЕЦБ: прогноз по подписанным договорам", kind: line, series: [{ ref: ecb/WAGE_TRACKER, part: forecast, label: "Прогноз трекера, г/г" }] }
        - id: credit
          title: "Деньги и кредит"
          charts:
            - title: "M3 и кредиты, YoY"
              kind: line
              series: [{ ref: ecb/M3_YOY, label: "M3" }, { ref: ecb/LOANS_NFC_YOY, label: "Кредиты бизнесу" }, { ref: ecb/LOANS_HH_YOY, label: "Кредиты домохозяйствам" }]
            - { title: "Стоимость кредита", kind: line, series: [{ ref: ecb/MIR_NFC, label: "Бизнесу" }, { ref: ecb/MIR_HOUSE, label: "Ипотека" }] }
            - title: "Опрос банков (BLS): кредиты бизнесу"
              kind: line
              series: [{ ref: ecb/BLS_NFC_STD, label: "Стандарты (> 0 — ужесточение)" }, { ref: ecb/BLS_NFC_DEM, label: "Спрос" }]
            - title: "Опрос банков (BLS): ипотека"
              kind: line
              series: [{ ref: ecb/BLS_HH_STD, label: "Стандарты" }, { ref: ecb/BLS_HH_DEM, label: "Спрос" }]
        - id: micro
          title: "Micro"
          views: [{ view: issuers }]
        - id: markets
          title: "Рынки"
          charts:
            - { title: "GER40 и STOXX 50", kind: line, series: [{ ref: "yahoo/^GDAXI" }, { ref: "yahoo/^STOXX50E" }] }
            - { title: "Волатильность", kind: line, series: [{ ref: stoxx/VDAX_NEW }, { ref: stoxx/VSTOXX }] }
            - { title: "EUR/USD", kind: line, series: [{ ref: "yahoo/EURUSD=X" }] }
            - { title: "Газ TTF", kind: line, series: [{ ref: "yahoo/TTF=F" }] }
            - { title: "Индекс системного стресса ЕЦБ (CISS)", kind: line, series: [{ ref: ecb/CISS }] }
            - { title: "Евро: эффективный курс (EER-40)", kind: line, series: [{ ref: ecb/EUR_NEER }] }
        - id: reactions
          title: "Реакции"
          views: [{ view: event_reactions }, { view: surprises }]
        - id: news-sentiment
          title: "News и Sentiment"
          views: [{ view: news_feed }, { view: topics }]
        - id: calendar
          title: "Календарь"
          views: [{ view: calendar }]
        - id: reports
          title: "Отчёты"
          views: [{ view: reports }]

metrics:
  zscore_window_daily_weekly: 52w
  zscore_window_monthly_quarterly: 5y

# =====================================================================
# ЧИСЛОВЫЕ РЯДЫ. Храним уровни. transforms — что считает Go.
# У рядов секций ecb, bundesbank, eurostat, stoxx, zew, manual:
#   id — имя в БД и в таблицах отчётов; key — как ряд называется у источника;
#   frequency: d | w | m | q; units: Percent per Annum (ставки и доходности, изменения в б.п.) | Percent |
#   Index | Balance (баланс опроса, пункты) | Index Points (котировка индекса) | Millions of Euro | Percent of GDP;
#   quality: official (по умолчанию) | proxy | manual.
# =====================================================================

fred:
  series:
    - { id: DGS10, agent: eu_fiscal, label: "UST 10Y", transforms: [level, d1w, d4w] }   # нога UST-Bund

# Производные (считает Go). Имя и формула должны совпадать с реализованными (неизвестное имя — ошибка конфига);
# входы — ряды любого источника из этого файла. short_history: z только при 120 наблюдениях в БД (ТЗ §17.5).
derived:
  # обе ноги — доходности Euronext MTS с Yahoo (D25); если MDE10.AS пропал или отстал больше чем на 5 дней —
  # спред считается против Bund 10Y Бундесбанка и помечается «запасная нога»
  - { name: BTP_BUND,        label: "BTP-Bund 10Y",  formula: "MIT10.AS - MDE10.AS", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w, z], short_history: true }
  - { name: OAT_BUND,        label: "OAT-Bund 10Y",  formula: "MFR10.AS - MDE10.AS", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w, z], short_history: true }
  - { name: UST_BUND,        label: "UST-Bund 10Y",  formula: "DGS10 - BUND_10Y",    agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w] }
  - { name: BUND_2S10S,      label: "2s10s Bund",    formula: "BUND_10Y - BUND_2Y",  agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w] }
  # не спред страны: разница двух кривых ЕЦБ, замена показателя → quality: proxy
  - { name: ECB_ALL_AAA_10Y, label: "Кривая ЕЦБ: все эмитенты − AAA, 10Y", formula: "ECB_YC_ALL_10Y - ECB_YC_AAA_10Y", agent: eu_fiscal, unit: bp, transforms: [level, d, d1w, d4w], quality: proxy }
  # отношение индексов, приведено к 100 на первой общей дате; Δ — в процентах
  - { name: GER40_NDX,       label: "GER40/NDX (нормировано)", formula: "^GDAXI / ^NDX (нормировано)", agent: eu_master, transforms: [level, d1w, d4w] }
  - { name: ESTR_DFR,   label: "€STR − ставка по депозитам", formula: "ESTR - ECB_DFR", agent: eu_monetary, unit: bp, transforms: [level, d1w, d4w] }
  - { name: NETEXP_EA,  label: "Чистый экспорт еврозоны",    formula: "EXPORTS_EA - IMPORTS_EA", agent: eu_monetary, transforms: [level, d] }
  - { name: EXCESS_LIQ, label: "Избыточная ликвидность (≈ текущие счета + депозитный механизм)", formula: "ILM_CURRENT_ACC + ILM_DEPOSIT_FAC", agent: eu_monetary, transforms: [level, d1w, d4w], quality: proxy }

yahoo:
  # некритичный источник (D7); опрос — regions[].yahoo_poll, догрузка перед недельным экспортом.
  # У символа: interval: 1h — история часовым интервалом, в ряд идёт последнее значение дня (доходности
  # Euronext MTS: дневной интервал отдаёт одну точку, часовой — с 2025-08-25, не дальше 730 дней назад);
  # exchange_tz — пояс биржи (день последнего закрытого бара), по умолчанию calendar.release_timezone;
  # units: Percent per Annum (доходность, изменения в б.п.) | Exchange Rate (4 знака) | Euro per MWh;
  # short_history: true — z-score только при 120 наблюдениях в БД (ТЗ §17.5).
  endpoint: "https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
  symbols:
    - { symbol: "^GDAXI",    agent: eu_master,   label: "GER40",         transforms: [level, d1w, d4w, ma50, ma200], exchange_tz: "Europe/Berlin" }
    - { symbol: "^NDX",      agent: eu_master,   label: "NASDAQ 100",    transforms: [level, d1w, d4w] }   # знаменатель GER40/NDX
    - { symbol: "^VIX",      agent: eu_news,     label: "VIX",           transforms: [level, d1w, d4w, z] }   # знаменатель VDAX/VIX (EU Sentiment)
    - { symbol: "^STOXX50E", agent: eu_master,   label: "Euro Stoxx 50", transforms: [level, d1w, d4w],              exchange_tz: "Europe/Berlin" }
    - { symbol: "EURUSD=X",  agent: eu_monetary, label: "EUR/USD",       transforms: [level, d1w, d4w], units: "Exchange Rate" }
    - { symbol: "CNY=X",     agent: eu_monetary, label: "USD/CNY",       transforms: [level, d1w, d4w], units: "Exchange Rate" }
    - { symbol: "BZ=F",      agent: eu_monetary, label: "Brent",         transforms: [level, d1w, d4w] }
    - { symbol: "TTF=F",     agent: eu_monetary, label: "TTF Gas",       transforms: [level, d1w, d4w, z], units: "Euro per MWh", interval: 1h }   # дневной интервал отдаёт одну точку (проверено 2026-11-10)
    # доходности Euronext MTS: обе ноги спредов BTP-Bund и OAT-Bund из одного источника (D25)
    - { symbol: "MIT10.AS",  agent: eu_fiscal,   label: "BTP 10Y (MTS)",  transforms: [level, d1w, d4w, z], interval: 1h, exchange_tz: "Europe/Amsterdam", units: "Percent per Annum", short_history: true }
    - { symbol: "MFR10.AS",  agent: eu_fiscal,   label: "OAT 10Y (MTS)",  transforms: [level, d1w, d4w, z], interval: 1h, exchange_tz: "Europe/Amsterdam", units: "Percent per Annum", short_history: true }
    - { symbol: "MDE10.AS",  agent: eu_fiscal,   label: "Bund 10Y (MTS)", transforms: [level, d1w, d4w, z], interval: 1h, exchange_tz: "Europe/Amsterdam", units: "Percent per Annum", short_history: true }

ecb:
  # ECB Data Portal, SDMX REST, CSV; ключ ряда — <поток>/<ключ>. LOOKUP 2026-11-09 (ТЗ §6.1).
  # Поток ICP обрывается на 2025-12 — HICP берётся из потока HICP. Частые запросы подряд — 504, клиент делает паузы.
  enabled: true
  endpoint: "https://data-api.ecb.europa.eu/service/data"
  poll_cron: "20 12 * * *"            # Europe/Bratislava: €STR 08:05, HICP 11:00, кривые 12:00
  series:
    - { id: ECB_DFR,        key: "FM/D.U2.EUR.4F.KR.DFR.LEV",            agent: eu_monetary, label: "Deposit Facility Rate",      frequency: d, units: "Percent per Annum", transforms: [level, d] }
    - { id: ESTR,           key: "EST/B.EU000A2X2A25.WT",                agent: eu_monetary, label: "€STR",                       frequency: d, units: "Percent per Annum", transforms: [level, d1w] }
    - { id: ECB_ASSETS,     key: "ILM/W.U2.C.T000000.Z5.Z01",            agent: eu_monetary, label: "Баланс Евросистемы",         frequency: w, units: "Millions of Euro",  transforms: [level, d1w, d4w] }
    - { id: HICP,           key: "HICP/M.U2.N.000000.4D0.INX",           agent: eu_monetary, label: "HICP headline",              frequency: m, units: "Index",             transforms: [yoy] }
    - { id: HICP_CORE,      key: "HICP/M.U2.N.XEF000.4D0.INX",           agent: eu_monetary, label: "HICP core",                  frequency: m, units: "Index",             transforms: [yoy] }
    - { id: HICP_SA,        key: "HICP/M.U2.Y.000000.4F0.INX",           agent: eu_monetary, label: "HICP headline (SA)",         frequency: m, units: "Index",             transforms: [mom, a3m] }
    - { id: HICP_CORE_SA,   key: "HICP/M.U2.Y.XEF000.4F0.INX",           agent: eu_monetary, label: "HICP core (SA)",             frequency: m, units: "Index",             transforms: [mom, a3m] }
    - { id: HICP_DE,        key: "HICP/M.DE.N.000000.4D0.INX",           agent: eu_monetary, label: "HICP Германия (с флешем)",   frequency: m, units: "Index",             transforms: [yoy] }
    - { id: ECB_YC_AAA_10Y, key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y",  agent: eu_fiscal,   label: "Кривая ЕЦБ AAA 10Y",         frequency: d, units: "Percent per Annum", transforms: [level, d1w, d4w] }
    - { id: ECB_YC_ALL_10Y, key: "YC/B.U2.EUR.4F.G_N_C.SV_C_YM.SR_10Y",  agent: eu_fiscal,   label: "Кривая ЕЦБ все эмитенты 10Y", frequency: d, units: "Percent per Annum", transforms: [level, d1w, d4w] }
    # месячные 10Y по странам (критерий конвергенции): хранятся отдельно, с дневными не склеиваются (D25)
    - { id: IRS_IT_10Y,     key: "IRS/M.IT.L.L40.CI.0000.EUR.N.Z",       agent: eu_fiscal,   label: "Италия 10Y (ЕЦБ, месяц)",    frequency: m, units: "Percent per Annum", transforms: [level, d] }
    - { id: IRS_FR_10Y,     key: "IRS/M.FR.L.L40.CI.0000.EUR.N.Z",       agent: eu_fiscal,   label: "Франция 10Y (ЕЦБ, месяц)",   frequency: m, units: "Percent per Annum", transforms: [level, d] }
    - { id: IRS_DE_10Y,     key: "IRS/M.DE.L.L40.CI.0000.EUR.N.Z",       agent: eu_fiscal,   label: "Германия 10Y (ЕЦБ, месяц)",  frequency: m, units: "Percent per Annum", transforms: [level, d] }
    # --- батч 11f (LOOKUP 2026-11-12): компоненты и страны HICP, деньги и кредит, BLS, ликвидность, TARGET,
    # зарплаты, ожидания, стресс и курсы. BLS — взвешенный нетто-процент банков (WFNET), > 0 — ужесточение.
    - { id: HICP_SERV,       key: "HICP/M.U2.N.SERV00.4D0.INX",            agent: eu_monetary, label: "HICP услуги",                  frequency: m, units: "Index",             transforms: [yoy, mom] }
    - { id: HICP_NEIG,       key: "HICP/M.U2.N.IGXE00.4D0.INX",            agent: eu_monetary, label: "HICP промтовары без энергии",  frequency: m, units: "Index",             transforms: [yoy, mom] }
    - { id: HICP_ENERGY,     key: "HICP/M.U2.N.NRGY00.4D0.INX",            agent: eu_monetary, label: "HICP энергия",                 frequency: m, units: "Index",             transforms: [yoy, mom] }
    - { id: HICP_FOOD,       key: "HICP/M.U2.N.FOOD00.4D0.INX",            agent: eu_monetary, label: "HICP еда, алкоголь, табак",    frequency: m, units: "Index",             transforms: [yoy, mom] }
    - { id: HICP_FR,         key: "HICP/M.FR.N.000000.4D0.INX",            agent: eu_monetary, label: "HICP Франция",                 frequency: m, units: "Index",             transforms: [yoy] }
    - { id: HICP_IT,         key: "HICP/M.IT.N.000000.4D0.INX",            agent: eu_monetary, label: "HICP Италия",                  frequency: m, units: "Index",             transforms: [yoy] }
    - { id: HICP_ES,         key: "HICP/M.ES.N.000000.4D0.INX",            agent: eu_monetary, label: "HICP Испания",                 frequency: m, units: "Index",             transforms: [yoy] }
    - { id: M3_YOY,          key: "BSI/M.U2.Y.V.M30.X.I.U2.2300.Z01.A",     agent: eu_monetary, label: "M3, г/г",                      frequency: m, units: "Percent",           transforms: [level, d] }
    - { id: LOANS_NFC_YOY,   key: "BSI/M.U2.Y.U.A20T.A.I.U2.2240.Z01.A",    agent: eu_monetary, label: "Кредиты бизнесу, г/г (скорр.)", frequency: m, units: "Percent",          transforms: [level, d] }
    - { id: LOANS_HH_YOY,    key: "BSI/M.U2.Y.U.A20T.A.I.U2.2250.Z01.A",    agent: eu_monetary, label: "Кредиты домохозяйствам, г/г (скорр.)", frequency: m, units: "Percent",   transforms: [level, d] }
    - { id: MIR_NFC,         key: "MIR/M.U2.B.A2I.AM.R.A.2240.EUR.N",       agent: eu_monetary, label: "Стоимость кредита бизнесу",    frequency: m, units: "Percent per Annum", transforms: [level, d] }
    - { id: MIR_HOUSE,       key: "MIR/M.U2.B.A2C.AM.R.A.2250.EUR.N",       agent: eu_monetary, label: "Стоимость ипотеки",            frequency: m, units: "Percent per Annum", transforms: [level, d] }
    - { id: BLS_NFC_STD,     key: "BLS/Q.U2.ALL.O.E.Z.B3.ST.S.WFNET",       agent: eu_monetary, label: "BLS: стандарты, кредиты бизнесу", frequency: q, units: "Balance",        transforms: [level, d] }
    - { id: BLS_NFC_DEM,     key: "BLS/Q.U2.ALL.O.E.Z.B3.ZZ.D.WFNET",       agent: eu_monetary, label: "BLS: спрос бизнеса на кредит", frequency: q, units: "Balance",          transforms: [level, d] }
    - { id: BLS_HH_STD,      key: "BLS/Q.U2.ALL.Z.H.H.B3.ST.S.WFNET",       agent: eu_monetary, label: "BLS: стандарты, ипотека",      frequency: q, units: "Balance",           transforms: [level, d] }
    - { id: BLS_HH_DEM,      key: "BLS/Q.U2.ALL.Z.H.H.B3.ZZ.D.WFNET",       agent: eu_monetary, label: "BLS: спрос на ипотеку",        frequency: q, units: "Balance",           transforms: [level, d] }
    - { id: ILM_CURRENT_ACC, key: "ILM/W.U2.C.L020100.U2.EUR",             agent: eu_monetary, label: "Текущие счета банков в Евросистеме", frequency: w, units: "Millions of Euro", transforms: [level, d1w, d4w] }
    - { id: ILM_DEPOSIT_FAC, key: "ILM/W.U2.C.L020200.U2.EUR",             agent: eu_monetary, label: "Депозитный механизм ЕЦБ",      frequency: w, units: "Millions of Euro",  transforms: [level, d1w, d4w] }
    - { id: ILM_GOV_DEP,     key: "ILM/W.U2.C.L050100.U2.EUR",             agent: eu_monetary, label: "Депозиты государств в Евросистеме", frequency: w, units: "Millions of Euro", transforms: [level, d1w, d4w] }
    - { id: TARGET_IT,       key: "TGB/M.IT.N.A094T.U2.EUR.E",             agent: eu_fiscal,   label: "TARGET Италия",                frequency: m, units: "Millions of Euro",  transforms: [level, d] }
    - { id: TARGET_DE,       key: "TGB/M.DE.N.A094T.U2.EUR.E",             agent: eu_fiscal,   label: "TARGET Германия",              frequency: m, units: "Millions of Euro",  transforms: [level, d] }
    - { id: NEG_WAGES,       key: "INW/Q.U2.N.INWR.000000.4F0.GY.IX",       agent: eu_monetary, label: "Переговорные зарплаты, г/г",   frequency: q, units: "Percent",           transforms: [level, d] }
    # wage tracker ЕЦБ публикует значения вперёд (по подписанным договорам): forecast: true — в отчёте значение на конец
    # недели как факт и строка «прогноз на <месяц>»; на дашборде — графики part: actual и part: forecast.
    - { id: WAGE_TRACKER,    key: "EWT/M.U2.N.WT.INWS._T.4F0.GY",          agent: eu_monetary, label: "Wage tracker ЕЦБ, г/г",        frequency: m, units: "Percent",           transforms: [level, d], forecast: true }
    - { id: CES_1Y,          key: "CES/M.Z18.ALL.T.C1120.NUM_VAR.WM",       agent: eu_monetary, label: "Ожидания инфляции потребителей, 12 мес. (медиана)", frequency: m, units: "Percent", transforms: [level, d] }
    - { id: CES_3Y,          key: "CES/M.Z18.ALL.T.C1220.NUM_VAR.WM",       agent: eu_monetary, label: "Ожидания инфляции потребителей, 3 года (медиана)",  frequency: m, units: "Percent", transforms: [level, d] }
    # SPF на следующий календарный год: ключ с {next_year} — один запрос по всем годам, для каждого квартала опроса берётся
    # прогноз на следующий год (2026-Q4 → 2027). Склейка в клиенте ЕЦБ (батч 11f).
    - { id: SPF_NEXT_YEAR,   key: "SPF/Q.U2.HICP.POINT.{next_year}.Q.AVG", agent: eu_monetary, label: "SPF: инфляция на следующий год", frequency: q, units: "Percent",       transforms: [level, d] }
    - { id: SPF_LT,          key: "SPF/Q.U2.HICP.POINT.LT.Q.AVG",          agent: eu_monetary, label: "SPF: инфляция в долгосроке",   frequency: q, units: "Percent",           transforms: [level, d] }
    - { id: CISS,            key: "CISS/D.U2.Z0Z.4F.EC.SS_CIN.IDX",        agent: eu_master,   label: "CISS — индекс системного стресса ЕЦБ", frequency: d, units: "Index",   transforms: [level, d1w, d4w, z] }
    - { id: EUR_NEER,        key: "EXR/D.E03.EUR.EN00.A",                  agent: eu_master,   label: "Евро, номинальный эффективный курс (EER-40)", frequency: d, units: "Index", transforms: [level, d1w, d4w] }
    - { id: EURGBP,          key: "EXR/D.GBP.EUR.SP00.A",                  agent: eu_master,   label: "EUR/GBP (ЕЦБ)",                frequency: d, units: "Exchange Rate",     transforms: [level, d1w, d4w] }
    - { id: EURJPY,          key: "EXR/D.JPY.EUR.SP00.A",                  agent: eu_master,   label: "EUR/JPY (ЕЦБ)",                frequency: d, units: "Exchange Rate",     transforms: [level, d1w, d4w] }
    - { id: IRS_ES_10Y,      key: "IRS/M.ES.L.L40.CI.0000.EUR.N.Z",        agent: eu_fiscal,   label: "Испания 10Y (ЕЦБ, месяц)",    frequency: m, units: "Percent per Annum", transforms: [level, d] }

bundesbank:
  # Bundesbank, SDMX REST, CSV (BOM, «;», десятичная запятая, день без значения — «.»). LOOKUP 2026-11-09.
  # Уровни и кривая Bund — отсюда (D25); дневные доходности выходят около 13:10.
  enabled: true
  endpoint: "https://api.statistiken.bundesbank.de/rest/data"
  poll_cron: "30 13 * * *"            # Europe/Bratislava
  series:
    - { id: BUND_2Y,       key: "BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A", agent: eu_fiscal,   label: "Bund 2Y",  frequency: d, units: "Percent per Annum", transforms: [level, d1w, d4w] }
    - { id: BUND_5Y,       key: "BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R05XX.R.A.A._Z._Z.A", agent: eu_fiscal,   label: "Bund 5Y",  frequency: d, units: "Percent per Annum", transforms: [level, d1w, d4w] }
    - { id: BUND_10Y,      key: "BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A", agent: eu_fiscal,   label: "Bund 10Y", frequency: d, units: "Percent per Annum", transforms: [level, d1w, d4w, z] }
    - { id: BUND_30Y,      key: "BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R30XX.R.A.A._Z._Z.A", agent: eu_fiscal,   label: "Bund 30Y", frequency: d, units: "Percent per Annum", transforms: [level, d1w, d4w] }
    - { id: DE_ORDERS,     key: "BBDE1/M.DE.Y.AEA1.A2P300000.F.C.I21.A",                 agent: eu_monetary, label: "Заказы промышленности DE (2021=100, SA)", frequency: m, units: "Index", transforms: [level, mom, yoy] }
    - { id: DE_PRODUCTION, key: "BBDE1/M.DE.Y.BAA1.A2P000000.G.C.I21.A",                 agent: eu_monetary, label: "Промпроизводство DE (2021=100, SA)",      frequency: m, units: "Index", transforms: [level, mom, yoy] }

eurostat:
  # Eurostat, JSON-stat 2.0; ключ ряда — <набор>?<измерение>=<код>&…: фильтр на каждое измерение, кроме времени
  # (ключ, который оставляет измерение открытым или ничего не выбирает, — ошибка). LOOKUP 2026-11-09.
  # ВВП хранится уровнем (цепные объёмы 2020, млн €); кв/кв и г/г считает Go. Релизы — 11:00.
  enabled: true
  endpoint: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
  poll_cron: "15 11 * * *"            # Europe/Bratislava
  series:
    - { id: GDP_EA,         key: "namq_10_gdp?geo=EA21&unit=CLV20_MEUR&s_adj=SCA&na_item=B1GQ",          agent: eu_monetary, label: "ВВП еврозоны (EA21), реальный",  frequency: q, units: "Millions of Euro", transforms: [qoq, yoy] }
    - { id: GDP_DE,         key: "namq_10_gdp?geo=DE&unit=CLV20_MEUR&s_adj=SCA&na_item=B1GQ",            agent: eu_monetary, label: "ВВП Германии, реальный",         frequency: q, units: "Millions of Euro", transforms: [qoq, yoy] }
    - { id: DE_DEBT_GDP,    key: "gov_10q_ggdebt?geo=DE&unit=PC_GDP&sector=S13&na_item=GD",              agent: eu_fiscal,   label: "Госдолг Германии",               frequency: q, units: "Percent of GDP",   transforms: [level, d] }
    - { id: IT_DEFICIT_GDP, key: "gov_10q_ggnfa?geo=IT&unit=PC_GDP&sector=S13&na_item=B9&s_adj=SCA",     agent: eu_fiscal,   label: "Баланс бюджета Италии (SCA)",    frequency: q, units: "Percent of GDP",   transforms: [level, d] }
    # опрос Еврокомиссии (BCS): в key_metrics вместо Ifo (D25)
