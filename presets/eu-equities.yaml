# =====================================================================
# EU MICRO — eu/micro/current_week.md (фаза 11, ТЗ §18.7)
# =====================================================================
# Компании вне квартального потока EDGAR. Цены — Yahoo (symbol), реакция на отчёт — §19.5.
# report_dates — вручную из финансовых календарей эмитентов (LOOKUP 2026-11-11); у DTE, SIE, ENR, RHM ещё calendar —
# страница календаря читается в poll_cron (фаза 14c, D29; у SAP, MBG, ALV, AIR страницы закрыты защитой от ботов); session: pre_market (по
# умолчанию, немецкие эмитенты публикуются до открытия Xetra) | after_close; estimate: true — дата не
# подтверждена эмитентом. facts — годовые цифры из структурированной отчётности: edgar (company facts
# 20-F, taxonomy ifrs-full) | esef (filings.xbrl.org, lei); тег без префикса — в taxonomy, тег расширения —
# с префиксом (airbus:...). press — лента релизов: rss | html (item — CSS-селектор записи списка,
# link_pattern — RE2 ссылки на релиз, body — CSS-селектор текста на странице релиза); title_words —
# оставить релизы с этими словами в заголовке; exclude — RE2 заголовков, которые не берём.
issuers:
  enabled: true
  poll_cron: "30 8,19 * * 1-5"      # Europe/Bratislava: после утренних отчётов и вечером
  request_interval: "3s"            # filings.xbrl.org отвечает 429 на несколько запросов подряд
  esef_url: "https://filings.xbrl.org"
  user_agent: "Mozilla/5.0 (compatible; macro-collector)"
  press_history_days: 30
  # абзацы релиза, которые берём (RE2, без учёта регистра): outlook, guidance, ожидания (ТЗ §19.4) + цитаты
  paragraphs: ['\boutlook\b', '\bguidance\b', '\bexpect(s|ed|ing|ations?)?\b', '\bforecast', '\bfull[- ]year\b', '\btariffs?\b']
  release_chars: 1500     # на релиз
  full_releases: 3        # релизов компании за неделю с абзацами; остальные — строкой
  stale_months: 15        # годовые цифры старше — пометка «устарели»
  companies:
    - ticker: SAP
      name: SAP
      symbol: SAP.DE
      currency: EUR
      importance: high
      report_dates:
        - { date: "2027-01-28", period: "Q4 2026", source: "SAP IR, события" }
        - { date: "2027-04-22", period: "Q1 2027", source: "SAP IR, события" }
      facts:
        source: edgar
        cik: "0001000184"
        taxonomy: ifrs-full
        forms: ["20-F"]
        concepts:
          revenue: [Revenue]
          operating_income: [ProfitLossFromOperatingActivities]
          net_income: [ProfitLossAttributableToOwnersOfParent]
          eps: [DilutedEarningsLossPerShare]
          operating_cash_flow: [CashFlowsFromUsedInOperatingActivities]
          capex: [PurchaseOfPropertyPlantAndEquipmentIntangibleAssetsOtherThanGoodwillInvestmentPropertyAndOtherNoncurrentAssets]
          shares: [AdjustedWeightedAverageShares]
      press:
        kind: rss
        url: "https://news.sap.com/feed/"
        # лента SAP — в основном маркетинг (решение пользователя 2026-11-11): только корпоративные заголовки
        title_words: [Results, Outlook, Quarter, Quarterly, Guidance, Executive Board, Supervisory Board, Dividend,
                      Buyback, Share Repurchase, Acquisition, Acquire, Acquires, Annual General Meeting]
    - ticker: SIE
      name: Siemens
      symbol: SIE.DE
      currency: EUR
      importance: high
      report_dates:
        - { date: "2026-11-12", period: "Q4 FY2026", source: "Siemens IR, финансовый календарь" }
      # Даты отчётов со страницы календаря (фаза 14c, D29): строки «дата | место | событие»; совпавшие события
      # дополняют report_dates (ручная дата без estimate побеждает, расхождение — пометкой).
      calendar:
        url: "https://www.siemens.com/en-us/company/investor-relations/financial-calendar/"
        kind: text
        events:
          - { match: '(?i)\b(?P<q>[1-4])(?:st|nd|rd|th) quarter results fiscal year (?P<year>\d{4})\b', period: "Q{q} FY{year}" }
      press:
        kind: rss
        url: "https://press.siemens.com/global/en/rss.xml"
      # Квартальный Excel эмитента (шаг 18, D15): только выручка, Profit Industrial Business, прибыль акционерам,
      # EPS базовая — квартал и год назад. Таблица — по строке-заголовку на любом листе, строка — по подписи,
      # столбец — по заголовку периода («Q3» над блоком + «FY 2026»); что-то не нашлось ровно один раз — ошибка.
      quarterly:
        page: "https://www.siemens.com/en-us/company/investor-relations/financial-results/"
        links: ['^(?P<year>\d{4})-q(?P<q>[1-4])-Financial-Results-Excel\.xlsx$']
        fiscal_year_end: 9          # финансовый год Siemens — до 30 сентября
        revenue_label: "Revenue"
        operating_label: "Profit Industrial Business"
        tables:
          - anchor: ["Consolidated Statements of Income"]
            rows:
              revenue:    { labels: ["Revenue"] }
              net_income: { labels: ["Shareholders of Siemens AG"] }
              eps:        { labels: ["Net income"], section: "Basic earnings per share" }
          - anchor: ["Overview of Segment figures"]
            group: "Profit"           # первая строка метки группы столбцов («Profit margin» — другая группа)
            rows:
              operating_income: { labels: ["Industrial Business"] }
    - ticker: ALV
      name: Allianz
      symbol: ALV.DE
      currency: EUR
      importance: high
      report_dates:
        - { date: "2026-11-12", period: "Q3 2026", source: "Allianz IR, финансовый календарь" }
      # пресс-релизы: allianz.com отвечает 403 (Cloudflare) — не обходим
      # Квартальный Financial supplement присылает пользователь (фаза 14c, D29): документом в бота с подписью
      # «ALV Q3 2026» или macroctl issuers file. Структура проверена на Q1–Q3 2026: лист «Allianz Group» — total
      # business volume (у страховщика вместо выручки), operating profit, прибыль акционерам; лист «… - EPS» —
      # базовая EPS (в Q1 строка «EPS basic (EUR)», с Q2 — «Basic EPS (EUR)»). Заголовок периода — «3Q 26».
      quarterly:
        source: file
        hint: "allianz.com, Investor Relations: квартальный «Financial supplement» (.xlsx)"
        links: ['(?i)^(?P<q>[1-4])q-(?P<year>\d{4})-financial-supplement-allianz\.xlsx$']
        revenue_label: "Total business volume"
        operating_label: "Operating profit"
        tables:
          - anchor: ["Consolidated financial results", "by quarters"]
            rows:
              revenue:          { labels: ["Total business volume¹", "Total business volume"] }
              operating_income: { labels: ["Operating profit"] }
              net_income:       { labels: ["Shareholders"], section: "Net income (loss) attributable to:" }
          - anchor: ["Earnings per share (EPS)", "by quarters"]
            rows:
              eps: { labels: ["Basic EPS (EUR)", "EPS basic (EUR)"] }
    - ticker: AIR
      name: Airbus
      symbol: AIR.DE
      currency: EUR
      importance: high
      report_dates:
        - { date: "2027-02-18", period: "FY 2026", source: "Airbus IR, финансовый календарь" }
      facts:
        source: esef
        lei: MINO79WLOO247M1IL051
        concepts:
          revenue: [Revenue]
          operating_income: ["airbus:ProfitLossBeforeFinancialResultAndIncomeTaxes"]   # EBIT, тег расширения Airbus
          net_income: [ProfitLossAttributableToOwnersOfParent]
          eps: [DilutedEarningsLossPerShare]
          operating_cash_flow: [CashFlowsFromUsedInOperatingActivities]
          capex: ["airbus:PurchasesOfIntangibleAssetsPropertyPlantAndEquipmentInvestmentProperty"]
          # числа акций в ESEF Airbus нет → Δ кап. «—»
      press:
        kind: html
        url: "https://www.airbus.com/en/newsroom/press-releases"
        item: "article.awx-card"
        link_pattern: '/en/newsroom/press-releases/\d{4}-\d{2}-'
        body: "article.node--press-release"
        exclude: ['share buybacks for week']
    - ticker: DTE
      name: Deutsche Telekom
      symbol: DTE.DE
      currency: EUR
      importance: medium
      report_dates:
        - { date: "2027-02-25", period: "FY 2026", source: "Deutsche Telekom IR, финансовый календарь" }
      calendar:
        url: "https://www.telekom.com/en/investor-relations/service/financial-calendar"
        kind: json_attr           # карточки «Upcoming IR dates»: JSON {title, startDate} в атрибуте data-event-data
        events:
          - { match: '(?i)^Q4 (?P<year>\d{4}) financial results$', period: "FY {year}" }
          - { match: '(?i)^(?:publication of )?Q(?P<q>[1-3]) (?P<year>\d{4}) financial results$', period: "Q{q} {year}" }
      quarterly:
        page: "https://www.telekom.com/en/investor-relations/publications/financial-results"
        # «dt-26q3-backup.xlsx», «dt-26q2-backup-de.xlsx» (2026), «DT 25Q4 Backup.xlsx» (2025); consensus — не берём
        links: ['(?i)^dt-(?P<year>\d{2})q(?P<q>[1-4])-backup(?:-de)?\.xlsx$', '(?i)^DT (?P<year>\d{2}|\d{4})Q(?P<q>[1-4]) Backup\.xlsx$']
        revenue_label: "Net revenue"
        operating_label: "EBIT"
        tables:
          - anchor: ["DT CONSOLIDATED INCOME STATEMENT", "AS REPORTED"]   # лист adj. — «ADJUSTED FOR SPECIAL FACTORS»
            rows:
              revenue:          { labels: ["NET REVENUE"] }
              operating_income: { labels: ["PROFIT (LOSS) FROM OPERATIONS (EBIT)"] }
              net_income:       { labels: ["NET PROFIT (LOSS)"] }
              # EPS в backup-файле DT нет → «—»
    - ticker: ENR
      name: Siemens Energy
      symbol: ENR.DE
      currency: EUR
      importance: medium
      report_dates:
        - { date: "2026-11-11", period: "Q4 FY2026", source: "Siemens Energy IR, финансовый календарь" }
      calendar:
        url: "https://www.siemens-energy.com/global/en/home/investor-relations.html"
        kind: text
        events:
          # вся строка — «Q1 FY2027»; «Q4 FY2026 Pre-Close Call» в списке публикаций — не дата отчёта
          - { match: '^Q(?P<q>[1-4]) FY(?P<year>\d{4})$', period: "Q{q} FY{year}" }
    - ticker: RHM
      name: Rheinmetall
      symbol: RHM.DE
      currency: EUR
      importance: medium
      report_dates:
        - { date: "2027-03-11", period: "FY 2026", source: "Rheinmetall IR, финансовый календарь" }
      calendar:
        url: "https://www.rheinmetall.com/en/investor-relations/calendar-and-events/financial-calendar"
        kind: text                # карточки «dd/mm/yyyy | Event» + заголовок; конференции и AGM не совпадают
        slash: dmy
        events:
          - { match: 'Publication of quarterly results Q(?P<q>[1-3]) (?P<year>\d{4})\b', period: "Q{q} {year}" }
          - { match: 'Publication of the Annual Report (?P<year>\d{4})\b', period: "FY {year}" }
    - ticker: MBG
      name: Mercedes-Benz
      symbol: MBG.DE
      currency: EUR
      importance: medium
      report_dates:
        # официальной даты нет; оценка Investing.com (LOOKUP 2026-11-11)
        - { date: "2027-02-18", period: "FY 2026", estimate: true, source: "Investing.com, оценка" }

