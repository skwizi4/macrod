    - { id: FR_DEFICIT_GDP, key: "gov_10q_ggnfa?geo=FR&unit=PC_GDP&sector=S13&na_item=B9&s_adj=SCA",   agent: eu_fiscal,   label: "Баланс бюджета Франции (SCA)",   frequency: q, units: "Percent of GDP",   transforms: [level] }
    - { id: ES_DEFICIT_GDP, key: "gov_10q_ggnfa?geo=ES&unit=PC_GDP&sector=S13&na_item=B9&s_adj=SCA",   agent: eu_fiscal,   label: "Баланс бюджета Испании (SCA)",   frequency: q, units: "Percent of GDP",   transforms: [level] }
    - { id: EA_DEFICIT_GDP, key: "gov_10q_ggnfa?geo=EA21&unit=PC_GDP&sector=S13&na_item=B9&s_adj=SCA", agent: eu_fiscal,   label: "Баланс бюджета еврозоны (SCA)",  frequency: q, units: "Percent of GDP",   transforms: [level] }
