#cloud-config
# First boot of the Oracle VM (Ubuntu 24.04, arm64): Docker Engine from Docker's
# apt repository (docs.docker.com/engine/install/ubuntu, checked 2026-11-06),
# the ubuntu user in the docker group, 2 GB swap for a 2 GB VM.
# Paste into Advanced options → Initialization script → Paste cloud-init script.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - sqlite3
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    cat > /etc/apt/sources.list.d/docker.sources <<EOT
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOT
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - touch /var/lib/cloud/macrod-ready
